<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Özel Video İzleyici</title>
  <meta name="theme-color" content="#121212">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #fff; padding-bottom: 30px; }
    header { background: #1a1a1a; padding: 14px; text-align: center; font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid #2a2a2a; }
    
    .tabs { display: flex; gap: 8px; padding: 12px; background: #121212; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #222; }
    .tab-btn { flex: 1; background: #272727; color: #aaa; border: none; padding: 10px 0; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #e50914; color: #fff; }

    .player-wrap { display: none; width: 100%; aspect-ratio: 16/9; background: #000; position: sticky; top: 58px; z-index: 9; }
    .player-wrap iframe { width: 100%; height: 100%; border: none; }

    .video-list { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .video-card { display: flex; gap: 10px; background: #1a1a1a; border-radius: 8px; overflow: hidden; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
    .video-card img { width: 120px; height: 90px; object-fit: cover; flex-shrink: 0; }
    .video-info { padding: 8px; display: flex; flex-direction: column; justify-content: center; }
    .video-title { font-size: 0.85rem; line-height: 1.3; font-weight: 500; color: #f1f1f1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .video-channel { font-size: 0.75rem; color: #aaa; margin-top: 5px; }

    .status-msg { text-align: center; color: #888; padding: 30px 10px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <header>Seçilmiş Videolar</header>

  <!-- Sadece bu 3 filtreye izin veriliyor -->
  <div class="tabs">
    <button class="tab-btn active" onclick="loadVideos('Çiçek')">🌸 Çiçek</button>
    <button class="tab-btn" onclick="loadVideos('İlahi')">🕌 İlahi</button>
    <button class="tab-btn" onclick="loadVideos('Karadeniz')">🌲 Karadeniz</button>
  </div>

  <!-- Video Oynatıcı Alanı -->
  <div id="playerWrap" class="player-wrap">
    <iframe id="mainPlayer" allowfullscreen allow="autoplay"></iframe>
  </div>

  <!-- Videoların Listelendiği Alan -->
  <div id="videoList" class="video-list"></div>

  <script>
    // 1. ADIMDA ALDIĞINIZ GOOGLE API ANAHTARINI BURAYA YAPIŞTIRIN:
    const API_KEY = "AIzaSyC7kOLWJaFJemVqHE6bB2B2EXwvom8Vaxs";

    async function loadVideos(keyword) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(keyword));
      });

      const list = document.getElementById("videoList");
      list.innerHTML = `<div class="status-msg">"${keyword}" videoları getiriliyor...</div>`;

      const endpoint = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&q=${encodeURIComponent(keyword)}&key=${API_KEY}`;

      try {
        const response = await fetch(endpoint);
        const data = await response.json();

        if (data.error) {
          list.innerHTML = `<div class="status-msg" style="color:#ff6b6b;">API Hatası: ${data.error.message}</div>`;
          return;
        }

        list.innerHTML = "";
        data.items.forEach(item => {
          const videoId = item.id.videoId;
          const title = item.snippet.title;
          const channel = item.snippet.channelTitle;
          const thumb = item.snippet.thumbnails.medium.url;

          const card = document.createElement("div");
          card.className = "video-card";
          card.onclick = () => playVideo(videoId);
          card.innerHTML = `
            <img src="${thumb}" loading="lazy">
            <div class="video-info">
              <div class="video-title">${title}</div>
              <div class="video-channel">${channel}</div>
            </div>
          `;
          list.appendChild(card);
        });
      } catch (err) {
        list.innerHTML = `<div class="status-msg" style="color:#ff6b6b;">Bağlantı hatası oluştu.</div>`;
      }
    }

    function playVideo(id) {
      const wrap = document.getElementById("playerWrap");
      const player = document.getElementById("mainPlayer");
      // rel=0 alakasız diğer video önerilerini kapatır
      player.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
      wrap.style.display = "block";
      wrap.scrollIntoView({ behavior: 'smooth' });
    }

    // İlk açılışta Çiçek videolarını listele
    loadVideos('Çiçek');
  </script>
</body>
</html>
