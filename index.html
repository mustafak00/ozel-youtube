<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube</title>
  
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="YouTube">
  <meta name="application-name" content="YouTube">
  
  <!-- YouTube Logosu (Ana Ekran İkonu) - Beyaz Arka Plan + Kırmızı Play -->
  <link rel="icon" type="image/png" sizes="192x192" href="https://www.gstatic.com/youtube/img/web/monogram/player/youtube_fill-192x192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="https://www.gstatic.com/youtube/img/web/monogram/player/youtube_fill-192x192.png">
  <link rel="manifest" href='data:application/manifest+json,{"name":"YouTube","short_name":"YouTube","start_url":".","display":"standalone","background_color":"%23ffffff","theme_color":"%23ffffff","icons":[{"src":"https://www.gstatic.com/youtube/img/web/monogram/player/youtube_fill-192x192.png","sizes":"192x192","type":"image/png","purpose":"any maskable"}]}'>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
    body{background:#fff;color:#0f0f0f;padding-bottom:56px;overflow-x:hidden}

    /* ÜST BAR */
    .yt-h{position:sticky;top:0;z-index:100;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #e5e5e5}
    .yt-logo{display:flex;align-items:center;gap:4px;font-weight:700;font-size:1.25rem;letter-spacing:-.8px;color:#0f0f0f}
    .yt-logo i{color:#ff0000;font-size:1.6rem}
    .hi{display:flex;align-items:center;gap:20px;font-size:1.15rem;color:#0f0f0f}
    .pav{width:28px;height:28px;border-radius:50%;background:#00796b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:bold}

    /* ARAMA */
    .srch{display:none;position:fixed;top:0;left:0;right:0;background:#fff;padding:8px 12px;z-index:250;box-shadow:0 2px 6px rgba(0,0,0,.1);align-items:center;gap:10px}
    .srch input{flex:1;border:1px solid #ccc;background:#f8f8f8;border-radius:20px;padding:9px 16px;font-size:.95rem;outline:none}
    .srch button{background:none;border:none;font-size:1.1rem;cursor:pointer;color:#333}

    /* VİDEO AKIŞI */
    .feed{display:flex;flex-direction:column;gap:16px;margin-top:4px}
    .vc{width:100%;cursor:pointer}
    .tw{position:relative;width:100%;aspect-ratio:16/9;background:#e0e0e0}
    .tw img{width:100%;height:100%;object-fit:cover}
    .db{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.8);color:#fff;font-size:.72rem;font-weight:600;padding:2px 5px;border-radius:4px}
    .vd{display:flex;gap:12px;padding:12px 14px 6px}
    .ca{width:38px;height:38px;border-radius:50%;background:#eee;flex-shrink:0;object-fit:cover}
    .mc{flex:1}
    .vt{font-size:.95rem;font-weight:500;line-height:1.35;color:#0f0f0f;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
    .vs{font-size:.78rem;color:#606060}

    /* İZLEME EKRANI */
    .wv{display:none;position:fixed;top:0;left:0;right:0;bottom:52px;background:#fff;z-index:200;overflow-y:auto}
    .pw{width:100%;aspect-ratio:16/9;background:#000;position:sticky;top:0;z-index:201}
    .pw iframe{width:100%;height:100%;border:none}
    .wi{padding:14px;border-bottom:1px solid #e5e5e5}
    .wtt{font-size:1.05rem;font-weight:600;line-height:1.35;color:#0f0f0f}
    .wm{font-size:.78rem;color:#606060;margin-top:4px}
    .wcr{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
    .wcl{display:flex;align-items:center;gap:10px;cursor:pointer}
    .wav{width:40px;height:40px;border-radius:50%;object-fit:cover}
    .wcn{font-size:.92rem;font-weight:600}
    .bsub{background:#0f0f0f;color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:.82rem;font-weight:600;cursor:pointer}
    .bsub.sd{background:#f2f2f2;color:#0f0f0f}

    /* KANAL SAYFASI */
    .cv{display:none;position:fixed;top:0;left:0;right:0;bottom:52px;background:#fff;z-index:210;overflow-y:auto}
    .ch{padding:24px 16px;text-align:center;border-bottom:1px solid #e5e5e5}
    .ch img{width:75px;height:75px;border-radius:50%;margin-bottom:10px;object-fit:cover}
    .ch h2{font-size:1.25rem}

    /* SHORTS */
    .sv{display:none;position:fixed;top:0;left:0;right:0;bottom:52px;background:#000;z-index:150;overflow:hidden}
    .sfw{width:100%;height:100%;position:relative}
    .sfw iframe{width:100%;height:100%;border:none}
    .soi{position:absolute;bottom:85px;left:16px;right:70px;z-index:10;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);pointer-events:none}
    .scl{display:flex;align-items:center;gap:8px;margin-bottom:8px;pointer-events:auto}
    .sav{width:34px;height:34px;border-radius:50%;object-fit:cover}
    .scn{font-weight:bold;font-size:.95rem}
    .sde{font-size:.88rem;line-height:1.3}
    .snc{position:absolute;bottom:90px;right:12px;z-index:10;display:flex;flex-direction:column;gap:14px}
    .scb{width:46px;height:46px;border-radius:50%;background:rgba(30,30,30,.7);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;backdrop-filter:blur(4px)}

    /* ABONELİKLER */
    .sab{display:flex;gap:14px;padding:12px 16px;overflow-x:auto;border-bottom:1px solid #e5e5e5;scrollbar-width:none}
    .sab::-webkit-scrollbar{display:none}
    .sai{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:62px;cursor:pointer}
    .sai img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid #065fd4}
    .sai span{font-size:.72rem;color:#606060;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ALT MENÜ */
    .bn{position:fixed;bottom:0;left:0;right:0;height:52px;background:#fff;border-top:1px solid #e5e5e5;display:flex;justify-content:space-around;align-items:center;z-index:300}
    .nb{background:none;border:none;color:#606060;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.65rem;cursor:pointer;width:33%}
    .nb i{font-size:1.25rem}
    .nb.ac{color:#0f0f0f;font-weight:bold}

    /* ARAMA KANAL KARTI */
    .scc{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #eee;background:#fafafa}
    .sci{display:flex;align-items:center;gap:14px;cursor:pointer}
    .sci img{width:56px;height:56px;border-radius:50%;object-fit:cover}

    /* YÜKLENME GÖSTERGESİ */
    .ld{text-align:center;padding:40px;color:#888;font-size:.9rem}
    .ldm{text-align:center;padding:20px;color:#888;font-size:.85rem}
  </style>
</head>
<body>

  <!-- ÜST BAR -->
  <header class="yt-h">
    <div class="yt-logo"><i class="fa-brands fa-youtube"></i><span>YouTube</span></div>
    <div class="hi">
      <i class="fa-solid fa-tower-broadcast"></i>
      <i class="fa-regular fa-bell"></i>
      <i class="fa-solid fa-magnifying-glass" onclick="openSrch()"></i>
      <div class="pav">Ö</div>
    </div>
  </header>

  <!-- ARAMA -->
  <div class="srch" id="srchW">
    <button onclick="closeSrch()"><i class="fa-solid fa-arrow-left"></i></button>
    <input type="text" id="srchI" placeholder="@kanal veya video ara..." onkeydown="if(event.key==='Enter') doSrch()">
    <button onclick="doSrch()"><i class="fa-solid fa-magnifying-glass"></i></button>
  </div>

  <div id="subBar" class="sab" style="display:none"></div>

  <!-- ANA SAYFA -->
  <main id="vList" class="feed"></main>

  <!-- İZLEME -->
  <div id="wV" class="wv">
    <div class="pw"><iframe id="wIf" allowfullscreen allow="autoplay"></iframe></div>
    <div class="wi">
      <div id="wTt" class="wtt"></div>
      <div class="wm" id="wMt">İzleniyor</div>
      <div class="wcr">
        <div class="wcl" onclick="openChan(curVC,curVU,curVA)">
          <img id="wAv" class="wav" src="">
          <div class="wcn" id="wCh"></div>
        </div>
        <button id="wSb" class="bsub" onclick="togSub(curVC,curVU,curVA)">Abone Ol</button>
      </div>
    </div>
    <div style="font-weight:bold;padding:12px 14px 4px;font-size:.95rem">Sıradaki Videolar</div>
    <div id="relL" class="feed"></div>
  </div>

  <!-- KANAL -->
  <div id="cV" class="cv">
    <div style="padding:12px 14px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:15px">
      <button onclick="closeChan()" style="background:none;border:none;font-size:1.2rem"><i class="fa-solid fa-arrow-left"></i></button>
      <span style="font-weight:600" id="cpTt">Kanal</span>
    </div>
    <div class="ch">
      <img id="cpAv" src="">
      <h2 id="cpNm"></h2>
      <div style="margin:12px 0"><button id="cpSb" class="bsub" onclick="togSub(curCN,curCU,curCA)">Abone Ol</button></div>
    </div>
    <div style="font-weight:bold;padding:12px 14px;font-size:.95rem">Kanal Videoları</div>
    <div id="cVL" class="feed"></div>
  </div>

  <!-- SHORTS -->
  <div id="sV" class="sv">
    <div class="sfw">
      <iframe id="sIf" allowfullscreen allow="autoplay"></iframe>
      <div class="soi">
        <div class="scl">
          <img id="sAv" class="sav" src="">
          <span id="sCh" class="scn"></span>
          <button id="sSb" class="bsub" style="padding:4px 10px;font-size:.75rem" onclick="togSub(curSC,'',curSA)">Abone Ol</button>
        </div>
        <div id="sTt" class="sde"></div>
      </div>
      <div class="snc">
        <button class="scb" onclick="nxtS()"><i class="fa-solid fa-chevron-down"></i></button>
        <button class="scb" onclick="prvS()"><i class="fa-solid fa-chevron-up"></i></button>
      </div>
    </div>
  </div>

  <!-- ALT MENÜ -->
  <nav class="bn">
    <button class="nb ac" id="bH" onclick="nav('home')"><i class="fa-solid fa-house"></i><span>Ana Sayfa</span></button>
    <button class="nb" id="bS" onclick="nav('shorts')"><i class="fa-solid fa-bolt"></i><span>Shorts</span></button>
    <button class="nb" id="bA" onclick="nav('subs')"><i class="fa-brands fa-youtube"></i><span>Abonelikler</span></button>
  </nav>

  <script>
    // PIPED API - SINIRSIZ ve API KEY GEREKTİRMEZ
    const P = "https://api.piped.private.coffee";
    const KW = ["karadeniz şarkıları","rize yaylalar","çiçek bakımı","huzur veren ilahiler","nefis yemek tarifleri","karadeniz türküsü","yemek tarifleri","çiçek çeşitleri"];

    let curNav='home', curVC='', curVU='', curVA='';
    let curCN='', curCU='', curCA='';
    let curSC='', curSA='';
    let sL=[], sI=0;

    // SONSUZ KAYDIRMA DEĞİŞKENLERİ
    let nextPageToken = null;
    let lastQuery = '';
    let isLoadingMore = false;
    let currentFeedTarget = 'vList';

    // Telefon geri tuşu
    window.addEventListener('popstate', function(){
      if(gid("cV").style.display==="block") closeChan(false);
      else if(gid("wV").style.display==="block") closeW(false);
      else if(gid("srchW").style.display==="flex") closeSrch();
    });

    // SONSUZ KAYDIRMA - Sayfa dibine gelince yeni video yükle
    window.addEventListener('scroll', function(){
      if(isLoadingMore || !nextPageToken) return;
      if(curNav !== 'home' && curNav !== 'search') return;
      if((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600){
        loadMore();
      }
    });

    function gid(id){return document.getElementById(id)}
    function getSubs(){return JSON.parse(localStorage.getItem('yt_s3')||'[]')}
    function saveSubs(s){localStorage.setItem('yt_s3',JSON.stringify(s))}
    function vid(u){if(!u)return'';if(u.includes('v='))return u.split('v=')[1].split('&')[0];return u.replace('/watch?v=','')}
    function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}
    function fmtD(s){if(!s||s<0)return'';var m=Math.floor(s/60),sc=Math.floor(s%60);return m+':'+(sc<10?'0':'')+sc}
    function fmtV(v){if(!v||v<0)return'';if(v>=1e6)return Math.floor(v/1e6)+'M';if(v>=1e3)return Math.floor(v/1e3)+'B';return v+''}

    // 1. ANA SAYFA (SONSUZ KAYDIRMA DESTEKLİ)
    async function loadHome(){
      var f=gid("vList");
      f.innerHTML=`<div class="ld">Videolar yükleniyor...</div>`;
      nextPageToken=null;
      lastQuery=KW[Math.floor(Math.random()*KW.length)];
      currentFeedTarget='vList';

      try{
        var r=await fetch(`${P}/search?q=${encodeURIComponent(lastQuery)}&filter=videos`);
        var d=await r.json();
        var items=(d.items||[]).filter(i=>i.type==='stream');
        items.sort(()=>0.5-Math.random());
        nextPageToken=d.nextpage||null;
        renderFeed(f,items,false);
      }catch(e){f.innerHTML=`<div class="ld">Bağlantı hatası. Tekrar deneyin.</div>`}
    }

    // SONSUZ KAYDIRMA: DAHA FAZLA VİDEO YÜKLE
    async function loadMore(){
      if(isLoadingMore||!nextPageToken) return;
      isLoadingMore=true;

      var f=gid(currentFeedTarget);
      // "Daha fazla yükleniyor..." göstergesi ekle
      var ldDiv=document.createElement('div');
      ldDiv.className='ldm';
      ldDiv.id='loadingMore';
      ldDiv.textContent='Daha fazla video yükleniyor...';
      f.appendChild(ldDiv);

      try{
        var r=await fetch(`${P}/nextpage/search?q=${encodeURIComponent(lastQuery)}&filter=videos&nextpage=${encodeURIComponent(nextPageToken)}`);
        var d=await r.json();
        var items=(d.items||[]).filter(i=>i.type==='stream');
        nextPageToken=d.nextpage||null;

        // Yükleniyor göstergesini kaldır
        var lm=gid('loadingMore');
        if(lm) lm.remove();

        // Yeni videoları mevcut listenin sonuna ekle
        items.forEach(item=>appendCard(f,item));
      }catch(e){
        var lm=gid('loadingMore');
        if(lm) lm.remove();
      }
      isLoadingMore=false;
    }

    // Video kartı oluştur
    function renderFeed(c,items,append){
      if(!append) c.innerHTML="";
      if(!items||items.length===0){
        if(!append) c.innerHTML=`<div class="ld">Video bulunamadı.</div>`;
        return;
      }
      items.forEach(item=>appendCard(c,item));
    }

    function appendCard(c,item){
      var id=vid(item.url);
      if(!id) return;
      var t=item.title, ch=item.uploaderName||'', cu=item.uploaderUrl||'';
      var th=item.thumbnail||'';
      var av=item.uploaderAvatar||`https://ui-avatars.com/api/?name=${encodeURIComponent(ch)}&background=f0f0f0&color=333`;
      var vw=fmtV(item.views), dur=fmtD(item.duration), ud=item.uploadedDate||'';

      var card=document.createElement("div");
      card.className="vc";
      card.innerHTML=`
        <div class="tw" onclick="openW('${id}','${esc(t)}','${esc(ch)}','${cu}','${av}')">
          <img src="${th}" loading="lazy">
          ${dur?`<div class="db">${dur}</div>`:''}
        </div>
        <div class="vd">
          <img class="ca" src="${av}" onclick="event.stopPropagation();openChan('${esc(ch)}','${cu}','${av}')">
          <div class="mc" onclick="openW('${id}','${esc(t)}','${esc(ch)}','${cu}','${av}')">
            <div class="vt">${t}</div>
            <div class="vs">${ch}${vw?' • '+vw+' görüntüleme':''}${ud?' • '+ud:''}</div>
          </div>
        </div>`;
      c.appendChild(card);
    }

    // 2. VİDEO İZLEME
    function openW(id,t,ch,cu,av){
      history.pushState({v:'w'},'');
      curVC=ch;curVU=cu;curVA=av;
      gid("wIf").src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
      gid("wTt").textContent=t;
      gid("wCh").textContent=ch;
      gid("wAv").src=av;
      updSub("wSb",ch);
      gid("wV").style.display="block";
      gid("wV").scrollTop=0;
      loadRel(ch);
    }
    function closeW(pop){
      gid("wV").style.display="none";
      gid("wIf").src="";
      if(pop!==false&&history.state&&history.state.v==='w') history.back();
    }
    async function loadRel(ch){
      var r=gid("relL");
      r.innerHTML=`<div class="ld">Sıradaki videolar...</div>`;
      try{
        var q=ch||'karadeniz';
        var res=await fetch(`${P}/search?q=${encodeURIComponent(q)}&filter=videos`);
        var d=await res.json();
        var s=(d.items||[]).filter(i=>i.type==='stream').slice(0,8);
        renderFeed(r,s,false);
      }catch(e){}
    }

    // 3. KANAL
    async function openChan(n,u,a){
      history.pushState({v:'c'},'');
      curCN=n;curCU=u;curCA=a||`https://ui-avatars.com/api/?name=${encodeURIComponent(n)}&background=065fd4&color=fff&size=128`;
      gid("cpNm").textContent=n;
      gid("cpTt").textContent=n;
      gid("cpAv").src=curCA;
      updSub("cpSb",n);
      gid("cV").style.display="block";
      gid("cV").scrollTop=0;
      var l=gid("cVL");
      l.innerHTML=`<div class="ld">Kanalın videoları yükleniyor...</div>`;

      if(u&&u.includes('/channel/')){
        var cid=u.replace('/channel/','');
        try{
          var r=await fetch(`${P}/channel/${cid}`);
          var d=await r.json();
          if(d.avatarUrl) gid("cpAv").src=d.avatarUrl;
          if(d.relatedStreams&&d.relatedStreams.length>0){renderFeed(l,d.relatedStreams,false);return;}
        }catch(e){}
      }
      try{
        var r2=await fetch(`${P}/search?q=${encodeURIComponent(n)}&filter=videos`);
        var d2=await r2.json();
        renderFeed(l,(d2.items||[]).filter(i=>i.type==='stream'),false);
      }catch(e){l.innerHTML=`<div class="ld">Videolar yüklenemedi.</div>`}
    }
    function closeChan(pop){
      gid("cV").style.display="none";
      if(pop!==false&&history.state&&history.state.v==='c') history.back();
    }

    // 4. ABONELİK
    function togSub(n,u,a){
      if(!n) return;
      var s=getSubs(),ex=s.find(x=>x.name===n);
      if(ex){s=s.filter(x=>x.name!==n);saveSubs(s);alert('"'+n+'" aboneliğinden çıkıldı.')}
      else{s.push({name:n,url:u||'',avatar:a||`https://ui-avatars.com/api/?name=${encodeURIComponent(n)}&background=065fd4&color=fff`});saveSubs(s);alert('"'+n+'" kanalına abone olundu!')}
      updSub("wSb",n);updSub("cpSb",n);updSub("sSb",n);renderSBar();
    }
    function updSub(id,n){
      var b=gid(id);if(!b)return;var s=getSubs();
      if(s.some(x=>x.name===n)){b.textContent="Abone Olundu";b.classList.add("sd")}
      else{b.textContent="Abone Ol";b.classList.remove("sd")}
    }
    function renderSBar(){
      var b=gid("subBar"),s=getSubs();b.innerHTML="";
      if(!s.length){b.style.display="none";return}
      b.style.display="flex";
      s.forEach(x=>{
        var d=document.createElement("div");d.className="sai";
        d.onclick=()=>openChan(x.name,x.url,x.avatar);
        d.innerHTML=`<img src="${x.avatar}"><span>${x.name}</span>`;
        b.appendChild(d);
      });
    }

    // 5. ARAMA (@HANDLE SINIRSIZ)
    function openSrch(){gid("srchW").style.display="flex";gid("srchI").focus()}
    function closeSrch(){gid("srchW").style.display="none"}
    async function doSrch(){
      var q=gid("srchI").value.trim();if(!q)return;
      closeSrch();
      var f=gid("vList");
      f.innerHTML=`<div class="ld">"${q}" aranıyor...</div>`;
      curNav='search';
      nextPageToken=null;
      lastQuery=q;
      currentFeedTarget='vList';

      try{
        var r=await fetch(`${P}/search?q=${encodeURIComponent(q)}&filter=all`);
        var d=await r.json();
        f.innerHTML="";
        if(!d.items||!d.items.length){f.innerHTML=`<div class="ld">Sonuç bulunamadı.</div>`;return}

        // Kanallar üstte
        d.items.filter(i=>i.type==='channel').forEach(c=>{
          var cd=document.createElement("div");cd.className="scc";
          cd.innerHTML=`
            <div class="sci" onclick="openChan('${esc(c.name)}','${c.url}','${c.thumbnail}')">
              <img src="${c.thumbnail}">
              <div><div style="font-weight:600;font-size:1.05rem">${c.name}</div>
              <div style="font-size:.8rem;color:#606060">${c.subscribers?c.subscribers+' abone • ':''}YouTube Kanalı</div></div>
            </div>
            <button class="bsub" onclick="togSub('${esc(c.name)}','${c.url}','${c.thumbnail}')">Abone Ol</button>`;
          f.appendChild(cd);
        });

        // Videolar
        var streams=d.items.filter(i=>i.type==='stream');
        nextPageToken=d.nextpage||null;
        streams.forEach(item=>appendCard(f,item));
      }catch(e){f.innerHTML=`<div class="ld">Arama yapılamadı.</div>`}
    }

    // 6. SHORTS (60 saniyenin altındaki videolar)
    async function initS(){
      gid("sIf").src="";
      gid("sTt").textContent="Shorts yükleniyor...";
      gid("sCh").textContent="";

      // İzin verilen konulardan kısa video ara
      var kw=KW[Math.floor(Math.random()*KW.length)];
      try{
        var r=await fetch(`${P}/search?q=${encodeURIComponent(kw)}&filter=videos`);
        var d=await r.json();
        // 60 saniyenin altındaki videoları Shorts olarak göster
        var shorts=(d.items||[]).filter(i=>i.type==='stream'&&i.duration>0&&i.duration<=180);

        // Yeterli kısa video yoksa tümünden al
        if(shorts.length<3){
          shorts=(d.items||[]).filter(i=>i.type==='stream'&&i.duration>0).slice(0,10);
        }

        if(shorts.length>0){
          sL=shorts;sI=0;dispS();
        }else{
          gid("sTt").textContent="Shorts bulunamadı. Başka konuyu deneyin.";
        }
      }catch(e){gid("sTt").textContent="Shorts yüklenemedi."}
    }

    function dispS(){
      if(!sL.length)return;
      var it=sL[sI], id=vid(it.url);
      curSC=it.uploaderName||'';
      curSA=it.uploaderAvatar||`https://ui-avatars.com/api/?name=${encodeURIComponent(curSC)}`;
      gid("sIf").src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1`;
      gid("sTt").textContent=it.title;
      gid("sCh").textContent=curSC;
      gid("sAv").src=curSA;
      updSub("sSb",curSC);
    }
    function nxtS(){if(sI<sL.length-1)sI++;else{sI=0;initS();return}dispS()}
    function prvS(){if(sI>0){sI--;dispS()}}
    function stopS(){gid("sIf").src=""}

    // 7. ALT MENÜ
    function nav(n){
      curNav=n;
      document.querySelectorAll('.nb').forEach(b=>b.classList.remove('ac'));
      gid("wV").style.display="none";
      gid("cV").style.display="none";
      gid("wIf").src="";
      stopS();
      gid("sV").style.display="none";
      gid("subBar").style.display="none";
      nextPageToken=null;

      if(n==='home'){gid("bH").classList.add("ac");loadHome()}
      else if(n==='shorts'){gid("bS").classList.add("ac");gid("sV").style.display="block";initS()}
      else if(n==='subs'){gid("bA").classList.add("ac");renderSBar();loadSubF()}
    }
    async function loadSubF(){
      var f=gid("vList"),s=getSubs();
      if(!s.length){f.innerHTML=`<div class="ld">Henüz abone olduğunuz kanal yok.<br>Üstteki büyütece <b>@okankarali</b> yazarak abone olabilirsiniz.</div>`;return}
      f.innerHTML=`<div class="ld">Abonelikleriniz yükleniyor...</div>`;
      var sub=s[Math.floor(Math.random()*s.length)];

      if(sub.url&&sub.url.includes('/channel/')){
        var cid=sub.url.replace('/channel/','');
        try{
          var r=await fetch(`${P}/channel/${cid}`);
          var d=await r.json();
          if(d.relatedStreams&&d.relatedStreams.length>0){renderFeed(f,d.relatedStreams,false);return}
        }catch(e){}
      }
      try{
        var r2=await fetch(`${P}/search?q=${encodeURIComponent(sub.name)}&filter=videos`);
        var d2=await r2.json();
        renderFeed(f,(d2.items||[]).filter(i=>i.type==='stream'),false);
      }catch(e){f.innerHTML=`<div class="ld">Videolar yüklenemedi.</div>`}
    }

    // SERVICE WORKER (PWA Yükleme İçin)
    if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}

    // Başlangıç
    loadHome();
  </script>
</body>
</html>
