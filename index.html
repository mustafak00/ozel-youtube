<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube</title>
  
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="YouTube">
  <meta name="application-name" content="YouTube">
  
  <link rel="icon" type="image/png" sizes="192x192" href="https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/512px-YouTube_full-color_icon_%282017%29.svg.png">
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/512px-YouTube_full-color_icon_%282017%29.svg.png">
  <link rel="manifest" href='data:application/manifest+json,{"name":"YouTube","short_name":"YouTube","start_url":".","display":"standalone","background_color":"%23ffffff","theme_color":"%23ffffff","icons":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/512px-YouTube_full-color_icon_%282017%29.svg.png","sizes":"192x192","type":"image/png"}]}'>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #ffffff; color: #0f0f0f; padding-bottom: 56px; overflow-x: hidden; }

    /* ÜST BAR */
    .yt-header {
      position: sticky; top: 0; z-index: 100; background: #ffffff;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid #e5e5e5;
    }
    .yt-logo { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 1.25rem; letter-spacing: -0.8px; color: #0f0f0f; }
    .yt-logo i { color: #ff0000; font-size: 1.6rem; }
    .yt-header-icons { display: flex; align-items: center; gap: 20px; font-size: 1.15rem; color: #0f0f0f; }
    .profile-avatar { width: 28px; height: 28px; border-radius: 50%; background: #00796b; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }

    /* ARAMA ÇUBUĞU */
    .search-bar-wrap {
      display: none; position: fixed; top: 0; left: 0; right: 0;
      background: #ffffff; padding: 8px 12px; z-index: 250;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); align-items: center; gap: 10px;
    }
    .search-bar-wrap input {
      flex: 1; border: 1px solid #ccc; background: #f8f8f8;
      border-radius: 20px; padding: 9px 16px; font-size: 0.95rem; outline: none;
    }
    .search-bar-wrap button { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: #333; }

    /* VİDEO AKIŞI */
    .feed { display: flex; flex-direction: column; gap: 16px; margin-top: 4px; }
    .video-card { width: 100%; cursor: pointer; }
    .thumb-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #e0e0e0; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .duration-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; font-size: 0.72rem; font-weight: 600; padding: 2px 5px; border-radius: 4px; }
    
    .video-details { display: flex; gap: 12px; padding: 12px 14px 6px 14px; }
    .chan-avatar { width: 38px; height: 38px; border-radius: 50%; background: #eee; flex-shrink: 0; object-fit: cover; }
    .meta-col { flex: 1; }
    .video-title { font-size: 0.95rem; font-weight: 500; line-height: 1.35; color: #0f0f0f; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
    .video-subtext { font-size: 0.78rem; color: #606060; }

    /* İZLEME EKRANI */
    .watch-view { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 52px; background: #ffffff; z-index: 200; overflow-y: auto; }
    .player-wrap { width: 100%; aspect-ratio: 16/9; background: #000; position: sticky; top: 0; z-index: 201; }
    .player-wrap iframe { width: 100%; height: 100%; border: none; }
    .watch-info { padding: 14px; border-bottom: 1px solid #e5e5e5; }
    .watch-title { font-size: 1.05rem; font-weight: 600; line-height: 1.35; color: #0f0f0f; }
    .watch-meta { font-size: 0.78rem; color: #606060; margin-top: 4px; }
    
    .watch-channel-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
    .watch-channel-left { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .watch-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .watch-channel-name { font-size: 0.92rem; font-weight: 600; }
    .btn-subscribe { background: #0f0f0f; color: #ffffff; border: none; border-radius: 20px; padding: 8px 16px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .btn-subscribe.subscribed { background: #f2f2f2; color: #0f0f0f; }

    /* KANAL PROFİL SAYFASI */
    .channel-view { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 52px; background: #ffffff; z-index: 210; overflow-y: auto; }
    .channel-header { padding: 24px 16px; text-align: center; border-bottom: 1px solid #e5e5e5; }
    .channel-header img { width: 75px; height: 75px; border-radius: 50%; margin-bottom: 10px; object-fit: cover; }
    .channel-header h2 { font-size: 1.25rem; }

    /* SHORTS EKRANI */
    .shorts-view {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 52px;
      background: #000; z-index: 150; overflow: hidden;
    }
    .short-frame-wrap { width: 100%; height: 100%; position: relative; }
    .short-frame-wrap iframe { width: 100%; height: 100%; border: none; }
    
    .short-overlay-info {
      position: absolute; bottom: 85px; left: 16px; right: 70px; z-index: 10;
      color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.8); pointer-events: none;
    }
    .short-chan-line { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; pointer-events: auto; }
    .short-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
    .short-chan-name { font-weight: bold; font-size: 0.95rem; }
    .short-desc { font-size: 0.88rem; line-height: 1.3; }

    .short-nav-controls {
      position: absolute; bottom: 90px; right: 12px; z-index: 10;
      display: flex; flex-direction: column; gap: 14px;
    }
    .short-circle-btn {
      width: 46px; height: 46px; border-radius: 50%; background: rgba(30,30,30,0.7);
      color: #fff; border: none; display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; cursor: pointer; backdrop-filter: blur(4px);
    }

    /* ABONELİKLER */
    .subs-avatar-bar { display: flex; gap: 14px; padding: 12px 16px; overflow-x: auto; border-bottom: 1px solid #e5e5e5; scrollbar-width: none; }
    .subs-avatar-bar::-webkit-scrollbar { display: none; }
    .sub-avatar-item { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 62px; cursor: pointer; }
    .sub-avatar-item img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid #065fd4; }
    .sub-avatar-item span { font-size: 0.72rem; color: #606060; max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ALT MENÜ */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 52px;
      background: #ffffff; border-top: 1px solid #e5e5e5;
      display: flex; justify-content: space-around; align-items: center; z-index: 300;
    }
    .nav-btn { background: none; border: none; color: #606060; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.65rem; cursor: pointer; width: 33%; }
    .nav-btn i { font-size: 1.25rem; }
    .nav-btn.active { color: #0f0f0f; font-weight: bold; }

    /* ARAMA KANAL KARTI */
    .search-channel-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #eee; background: #fafafa; }
    .search-chan-info { display: flex; align-items: center; gap: 14px; cursor: pointer; }
    .search-chan-info img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }

    .loading { text-align: center; padding: 40px; color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>

  <!-- ÜST BAR -->
  <header class="yt-header" id="mainHeader">
    <div class="yt-logo">
      <i class="fa-brands fa-youtube"></i>
      <span>YouTube</span>
    </div>
    <div class="yt-header-icons">
      <i class="fa-solid fa-tower-broadcast"></i>
      <i class="fa-regular fa-bell"></i>
      <i class="fa-solid fa-magnifying-glass" onclick="openSearch()"></i>
      <div class="profile-avatar">Ö</div>
    </div>
  </header>

  <!-- ARAMA ALANI -->
  <div class="search-bar-wrap" id="searchWrap">
    <button onclick="closeSearch()"><i class="fa-solid fa-arrow-left"></i></button>
    <input type="text" id="searchInput" placeholder="Örn: @okankarali veya video..." onkeydown="if(event.key==='Enter') executeSearch()">
    <button onclick="executeSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
  </div>

  <div id="subsBar" class="subs-avatar-bar" style="display: none;"></div>

  <!-- ANA SAYFA VİDEO LİSTESİ -->
  <main id="videoList" class="feed"></main>

  <!-- İZLEME EKRANI -->
  <div id="watchView" class="watch-view">
    <div class="player-wrap">
      <iframe id="watchIframe" allowfullscreen allow="autoplay"></iframe>
    </div>
    <div class="watch-info">
      <div id="watchTitle" class="watch-title"></div>
      <div class="watch-meta" id="watchMeta">İzleniyor</div>
      
      <div class="watch-channel-row">
        <div class="watch-channel-left" onclick="openChannelPage(currentVideoChannel, currentVideoChanUrl, currentVideoAvatar)">
          <img id="watchAvatar" class="watch-avatar" src="">
          <div class="watch-channel-name" id="watchChannel"></div>
        </div>
        <button id="watchSubBtn" class="btn-subscribe" onclick="toggleSub(currentVideoChannel, currentVideoChanUrl, currentVideoAvatar)">Abone Ol</button>
      </div>
    </div>

    <div style="font-weight: bold; padding: 12px 14px 4px 14px; font-size: 0.95rem;">Sıradaki Videolar</div>
    <div id="relatedList" class="feed"></div>
  </div>

  <!-- KANAL DETAY SAYFASI -->
  <div id="channelView" class="channel-view">
    <div style="padding: 12px 14px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 15px;">
      <button onclick="closeChannelPage()" style="background:none; border:none; font-size:1.2rem;"><i class="fa-solid fa-arrow-left"></i></button>
      <span style="font-weight: 600;" id="chanPageTitle">Kanal</span>
    </div>
    <div class="channel-header">
      <img id="chanPageAvatar" src="">
      <h2 id="chanPageName"></h2>
      <div style="margin: 12px 0;">
        <button id="chanPageSubBtn" class="btn-subscribe" onclick="toggleSub(currentViewingChannel, currentViewingChanUrl, currentViewingAvatar)">Abone Ol</button>
      </div>
    </div>
    <div style="font-weight: bold; padding: 12px 14px; font-size: 0.95rem;">Kanal Videoları</div>
    <div id="channelVideosList" class="feed"></div>
  </div>

  <!-- SHORTS EKRANI -->
  <div id="shortsView" class="shorts-view">
    <div class="short-frame-wrap">
      <iframe id="shortIframe" allowfullscreen allow="autoplay"></iframe>
      <div class="short-overlay-info">
        <div class="short-chan-line">
          <img id="shortAvatar" class="short-avatar" src="">
          <span id="shortChannel" class="short-chan-name"></span>
          <button id="shortSubBtn" class="btn-subscribe" style="padding:4px 10px; font-size:0.75rem;" onclick="toggleSub(currentShortChannel, '', currentShortAvatar)">Abone Ol</button>
        </div>
        <div id="shortTitle" class="short-desc"></div>
      </div>
      <div class="short-nav-controls">
        <button class="short-circle-btn" onclick="nextShort()"><i class="fa-solid fa-chevron-down"></i></button>
        <button class="short-circle-btn" onclick="prevShort()"><i class="fa-solid fa-chevron-up"></i></button>
      </div>
    </div>
  </div>

  <!-- ALT MENÜ -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="btnHome" onclick="switchNav('home')">
      <i class="fa-solid fa-house"></i>
      <span>Ana Sayfa</span>
    </button>
    <button class="nav-btn" id="btnShorts" onclick="switchNav('shorts')">
      <i class="fa-solid fa-bolt"></i>
      <span>Shorts</span>
    </button>
    <button class="nav-btn" id="btnSubs" onclick="switchNav('subs')">
      <i class="fa-brands fa-youtube"></i>
      <span>Abonelikler</span>
    </button>
  </nav>

  <script>
    // AÇIK KAYNAK VE KOTASIZ PIPED API MOTORU (API KEY GEREKTİRMEZ!)
    const PIPED_API = "https://api.piped.private.coffee";
    
    const ALLOWED_KEYWORDS = [
      "karadeniz şarkıları", "rize yaylaları", "çiçek bakımı", 
      "huzur veren ilahiler", "nefis yemek tarifleri", "karadeniz türküsü"
    ];

    let currentNav = 'home';
    let currentVideoChannel = '', currentVideoChanUrl = '', currentVideoAvatar = '';
    let currentViewingChannel = '', currentViewingChanUrl = '', currentViewingAvatar = '';
    let currentShortChannel = '', currentShortAvatar = '';

    let shortsList = [];
    let currentShortIndex = 0;

    // Telefon Geri Tuşu
    window.addEventListener('popstate', function() {
      if (document.getElementById("channelView").style.display === "block") {
        closeChannelPage(false);
      } else if (document.getElementById("watchView").style.display === "block") {
        closeWatch(false);
      } else if (document.getElementById("searchWrap").style.display === "flex") {
        closeSearch();
      }
    });

    function getSubs() {
      return JSON.parse(localStorage.getItem('yt_subs_v2') || '[]');
    }

    function saveSubs(subs) {
      localStorage.setItem('yt_subs_v2', JSON.stringify(subs));
    }

    function extractVideoId(url) {
      if (!url) return '';
      if (url.includes('v=')) return url.split('v=')[1].split('&')[0];
      if (url.startsWith('/watch?v=')) return url.replace('/watch?v=', '');
      return url;
    }

    // 1. ANA SAYFA KARIŞIK AKIŞI (KOTASIZ VE SINIRSIZ)
    async function loadHomeFeed() {
      const feed = document.getElementById("videoList");
      feed.innerHTML = `<div class="loading">Videolar hazırlanıyor...</div>`;

      // İzinli konulardan rastgele 2 konu seçip birleştir
      const shuffled = [...ALLOWED_KEYWORDS].sort(() => 0.5 - Math.random());
      const query = shuffled[0];

      try {
        const res = await fetch(`${PIPED_API}/search?q=${encodeURIComponent(query)}&filter=all`);
        const data = await res.json();
        
        let streams = (data.items || []).filter(item => item.type === 'stream');
        streams.sort(() => 0.5 - Math.random());
        renderFeed(feed, streams);
      } catch (e) {
        feed.innerHTML = `<div class="loading" style="color:red;">Bağlantı hatası oluştu, lütfen tekrar deneyin.</div>`;
      }
    }

    function renderFeed(container, items) {
      container.innerHTML = "";
      if (!items || items.length === 0) {
        container.innerHTML = `<div class="loading">Video bulunamadı.</div>`;
        return;
      }

      items.forEach(item => {
        const videoId = extractVideoId(item.url);
        if (!videoId) return;

        const title = item.title;
        const channel = item.uploaderName || '';
        const chanUrl = item.uploaderUrl || '';
        const thumb = item.thumbnail;
        const avatar = item.uploaderAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(channel)}&background=f0f0f0&color=333`;
        const views = item.views ? `${Math.floor(item.views / 1000)} B görüntüleme` : '';

        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
          <div class="thumb-wrap" onclick="openWatch('${videoId}', '${escapeQuotes(title)}', '${escapeQuotes(channel)}', '${chanUrl}', '${avatar}')">
            <img src="${thumb}" loading="lazy">
            <div class="duration-badge">${formatDuration(item.duration)}</div>
          </div>
          <div class="video-details">
            <img class="chan-avatar" src="${avatar}" onclick="openChannelPage('${escapeQuotes(channel)}', '${chanUrl}', '${avatar}')">
            <div class="meta-col" onclick="openWatch('${videoId}', '${escapeQuotes(title)}', '${escapeQuotes(channel)}', '${chanUrl}', '${avatar}')">
              <div class="video-title">${title}</div>
              <div class="video-subtext">${channel} • ${views}</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function formatDuration(sec) {
      if (!sec) return "Video";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // 2. VİDEO İZLEME
    function openWatch(videoId, title, channel, chanUrl, avatar) {
      history.pushState({ view: 'watch' }, '');
      currentVideoChannel = channel;
      currentVideoChanUrl = chanUrl;
      currentVideoAvatar = avatar;

      const watch = document.getElementById("watchView");
      const iframe = document.getElementById("watchIframe");
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;

      document.getElementById("watchTitle").textContent = title;
      document.getElementById("watchChannel").textContent = channel;
      document.getElementById("watchAvatar").src = avatar;

      updateSubButtonUI("watchSubBtn", channel);

      watch.style.display = "block";
      watch.scrollTop = 0;

      loadRelatedVideos(channel);
    }

    function closeWatch(shouldPop = true) {
      document.getElementById("watchView").style.display = "none";
      document.getElementById("watchIframe").src = "";
      if (shouldPop && history.state && history.state.view === 'watch') {
        history.back();
      }
    }

    async function loadRelatedVideos(channel) {
      const rel = document.getElementById("relatedList");
      try {
        const res = await fetch(`${PIPED_API}/search?q=${encodeURIComponent(channel || 'karadeniz')}&filter=all`);
        const data = await res.json();
        const streams = (data.items || []).filter(item => item.type === 'stream').slice(0, 8);
        renderFeed(rel, streams);
      } catch (e) {}
    }

    // 3. KANAL PROFİLİ VE KANAL VİDEOLARI
    async function openChannelPage(channelName, chanUrl, avatarUrl) {
      history.pushState({ view: 'channel' }, '');
      currentViewingChannel = channelName;
      currentViewingChanUrl = chanUrl;
      currentViewingAvatar = avatarUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(channelName)}&background=065fd4&color=fff&size=128`;

      const page = document.getElementById("channelView");
      document.getElementById("chanPageName").textContent = channelName;
      document.getElementById("chanPageTitle").textContent = channelName;
      document.getElementById("chanPageAvatar").src = currentViewingAvatar;

      updateSubButtonUI("chanPageSubBtn", channelName);
      page.style.display = "block";
      page.scrollTop = 0;

      const list = document.getElementById("channelVideosList");
      list.innerHTML = `<div class="loading">Kanalın videoları getiriliyor...</div>`;

      // Kanal ID varsa (/channel/UC...) doğrudan kanal endpointinden çek
      if (chanUrl && chanUrl.includes('/channel/')) {
        const chanId = chanUrl.replace('/channel/', '');
        try {
          const res = await fetch(`${PIPED_API}/channel/${chanId}`);
          const data = await res.json();
          if (data.relatedStreams && data.relatedStreams.length > 0) {
            renderFeed(list, data.relatedStreams);
            return;
          }
        } catch (e) {}
      }

      // Yoksa isimle ara
      fetch(`${PIPED_API}/search?q=${encodeURIComponent(channelName)}&filter=all`)
        .then(r => r.json())
        .then(d => {
          const streams = (d.items || []).filter(i => i.type === 'stream');
          renderFeed(list, streams);
        })
        .catch(() => { list.innerHTML = `<div class="loading">Videolar yüklenemedi.</div>`; });
    }

    function closeChannelPage(shouldPop = true) {
      document.getElementById("channelView").style.display = "none";
      if (shouldPop && history.state && history.state.view === 'channel') {
        history.back();
      }
    }

    function toggleSub(channelName, chanUrl, avatarUrl) {
      if (!channelName) return;
      let subs = getSubs();
      const existing = subs.find(s => s.name === channelName);

      if (existing) {
        subs = subs.filter(s => s.name !== channelName);
        saveSubs(subs);
        alert(`"${channelName}" aboneliğinden çıkıldı.`);
      } else {
        subs.push({
          name: channelName,
          url: chanUrl || '',
          avatar: avatarUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(channelName)}&background=065fd4&color=fff`
        });
        saveSubs(subs);
        alert(`"${channelName}" kanalına abone olundu!`);
      }

      updateSubButtonUI("watchSubBtn", channelName);
      updateSubButtonUI("chanPageSubBtn", channelName);
      updateSubButtonUI("shortSubBtn", channelName);
      renderSubsBar();
    }

    function updateSubButtonUI(btnId, channelName) {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      const subs = getSubs();
      if (subs.some(s => s.name === channelName)) {
        btn.textContent = "Abone Olundu";
        btn.classList.add("subscribed");
      } else {
        btn.textContent = "Abone Ol";
        btn.classList.remove("subscribed");
      }
    }

    function renderSubsBar() {
      const bar = document.getElementById("subsBar");
      const subs = getSubs();
      bar.innerHTML = "";
      if (subs.length === 0) {
        bar.style.display = "none";
        return;
      }
      bar.style.display = "flex";
      subs.forEach(s => {
        const item = document.createElement("div");
        item.className = "sub-avatar-item";
        item.onclick = () => openChannelPage(s.name, s.url, s.avatar);
        item.innerHTML = `
          <img src="${s.avatar}">
          <span>${s.name}</span>
        `;
        bar.appendChild(item);
      });
    }

    // 4. KESİNTİSİZ ARAMA (@OKANKARALI VE HER ŞEY)
    function openSearch() {
      document.getElementById("searchWrap").style.display = "flex";
      document.getElementById("searchInput").focus();
    }

    function closeSearch() {
      document.getElementById("searchWrap").style.display = "none";
    }

    async function executeSearch() {
      let query = document.getElementById("searchInput").value.trim();
      if (!query) return;

      closeSearch();
      const feed = document.getElementById("videoList");
      feed.innerHTML = `<div class="loading">"${query}" aranıyor...</div>`;

      try {
        const res = await fetch(`${PIPED_API}/search?q=${encodeURIComponent(query)}&filter=all`);
        const data = await res.json();
        feed.innerHTML = "";

        if (!data.items || data.items.length === 0) {
          feed.innerHTML = `<div class="loading">Sonuç bulunamadı.</div>`;
          return;
        }

        // Kanalları en üste koy
        const channels = data.items.filter(i => i.type === 'channel');
        channels.forEach(c => {
          const card = document.createElement("div");
          card.className = "search-channel-card";
          card.innerHTML = `
            <div class="search-chan-info" onclick="openChannelPage('${escapeQuotes(c.name)}', '${c.url}', '${c.thumbnail}')">
              <img src="${c.thumbnail}">
              <div>
                <div style="font-weight: 600; font-size:1.05rem;">${c.name}</div>
                <div style="font-size: 0.8rem; color: #606060;">${c.subscribers ? c.subscribers + ' abone • ' : ''}YouTube Kanalı</div>
              </div>
            </div>
            <button class="btn-subscribe" onclick="toggleSub('${escapeQuotes(c.name)}', '${c.url}', '${c.thumbnail}')">Abone Ol</button>
          `;
          feed.appendChild(card);
        });

        // Videoları listele
        const streams = data.items.filter(i => i.type === 'stream');
        if (streams.length > 0) {
          const listDiv = document.createElement("div");
          renderFeed(listDiv, streams);
          feed.appendChild(listDiv);
        }
      } catch (e) {
        feed.innerHTML = `<div class="loading">Arama sırasında hata oluştu.</div>`;
      }
    }

    // 5. KOTASIZ VE TAKILMAYAN SHORTS MOTORU
    async function initShorts() {
      const iframe = document.getElementById("shortIframe");
      iframe.src = "";
      document.getElementById("shortTitle").textContent = "Shorts yükleniyor...";
      document.getElementById("shortChannel").textContent = "";

      try {
        const res = await fetch(`${PIPED_API}/search?q=karadeniz%20shorts&filter=all`);
        const data = await res.json();
        const shorts = (data.items || []).filter(i => i.type === 'stream');
        
        if (shorts.length > 0) {
          shortsList = shorts;
          currentShortIndex = 0;
          displayCurrentShort();
        }
      } catch (e) {
        document.getElementById("shortTitle").textContent = "Shorts yüklenemedi.";
      }
    }

    function displayCurrentShort() {
      if (!shortsList || shortsList.length === 0) return;
      const item = shortsList[currentShortIndex];
      const videoId = extractVideoId(item.url);

      currentShortChannel = item.uploaderName || '';
      currentShortAvatar = item.uploaderAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentShortChannel)}`;

      const iframe = document.getElementById("shortIframe");
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&playsinline=1`;

      document.getElementById("shortTitle").textContent = item.title;
      document.getElementById("shortChannel").textContent = currentShortChannel;
      document.getElementById("shortAvatar").src = currentShortAvatar;

      updateSubButtonUI("shortSubBtn", currentShortChannel);
    }

    function nextShort() {
      if (currentShortIndex < shortsList.length - 1) {
        currentShortIndex++;
      } else {
        currentShortIndex = 0;
      }
      displayCurrentShort();
    }

    function prevShort() {
      if (currentShortIndex > 0) {
        currentShortIndex--;
        displayCurrentShort();
      }
    }

    function stopShortsAudio() {
      const iframe = document.getElementById("shortIframe");
      if (iframe) iframe.src = "";
    }

    // 6. ALT MENÜ
    function switchNav(nav) {
      currentNav = nav;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById("watchView").style.display = "none";
      document.getElementById("channelView").style.display = "none";
      document.getElementById("watchIframe").src = "";

      stopShortsAudio();
      document.getElementById("shortsView").style.display = "none";
      document.getElementById("subsBar").style.display = "none";

      if (nav === 'home') {
        document.getElementById("btnHome").classList.add("active");
        loadHomeFeed();
      } else if (nav === 'shorts') {
        document.getElementById("btnShorts").classList.add("active");
        document.getElementById("shortsView").style.display = "block";
        initShorts();
      } else if (nav === 'subs') {
        document.getElementById("btnSubs").classList.add("active");
        renderSubsBar();
        loadSubsFeed();
      }
    }

    async function loadSubsFeed() {
      const feed = document.getElementById("videoList");
      const subs = getSubs();
      if (subs.length === 0) {
        feed.innerHTML = `<div class="loading">Henüz abone olduğunuz kanal yok.<br>Üstteki büyütece <b>@okankarali</b> yazarak abone olabilirsiniz.</div>`;
        return;
      }
      feed.innerHTML = `<div class="loading">Abonelikleriniz yükleniyor...</div>`;
      const s = subs[Math.floor(Math.random() * subs.length)];
      openChannelPage(s.name, s.url, s.avatar);
    }

    // Başlangıçta ana sayfayı aç
    loadHomeFeed();
  </script>
</body>
</html>
