<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube</title>
  
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="YouTube">
  <meta name="application-name" content="YouTube">
  
  <!-- YouTube Logosu (Resmi Google Maskable İkonları - 192x192 ve 512x512) -->
  <link rel="icon" type="image/png" sizes="192x192" href="https://www.gstatic.com/youtube/img/branding/favicon/favicon_192x192_v2.png">
  <link rel="apple-touch-icon" sizes="192x192" href="https://www.gstatic.com/youtube/img/web/maskable/logo_192x192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="https://www.gstatic.com/youtube/img/web/maskable/logo_512x512.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
    body{background:#fff;color:#0f0f0f;padding-bottom:56px;overflow-x:hidden}

    /* ÜST BAR */
    .yt-h{position:sticky;top:0;height:48px;z-index:250;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #e5e5e5}
    .yt-logo{display:flex;align-items:center;gap:4px;font-weight:700;font-size:1.25rem;letter-spacing:-.8px;color:#0f0f0f;cursor:pointer;-webkit-user-select:none;user-select:none}
    .yt-logo i{color:#ff0000;font-size:1.6rem}
    .hi{display:flex;align-items:center;gap:20px;font-size:1.15rem;color:#0f0f0f}
    .pav{width:28px;height:28px;border-radius:50%;background:#00796b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:bold}

    /* ARAMA EKRANI VE SON ARAMALAR LİSTESİ */
    .srch-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:350;flex-direction:column}
    .srch-top{display:flex;align-items:center;padding:6px 12px;gap:10px;height:48px;border-bottom:1px solid #e5e5e5;background:#fff}
    .srch-top input{flex:1;border:1px solid #ccc;background:#f8f8f8;border-radius:20px;padding:9px 16px;font-size:.95rem;outline:none}
    .srch-top button{background:none;border:none;font-size:1.1rem;cursor:pointer;color:#333}
    .srch-hist{flex:1;overflow-y:auto;background:#fff;-webkit-overflow-scrolling:touch}
    .sh-item{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #f6f6f6;cursor:pointer}
    .sh-item:active{background:#f0f0f0}
    .sh-left{display:flex;align-items:center;gap:14px;color:#0f0f0f;font-size:.92rem;flex:1}
    .sh-left i{color:#888;font-size:.9rem}
    .sh-del{background:none;border:none;color:#999;font-size:1.3rem;padding:0 8px;cursor:pointer;line-height:1}
    .sh-title{padding:12px 16px 4px;font-size:.75rem;font-weight:700;color:#606060;letter-spacing:.5px;text-transform:uppercase}

    /* KATEGORİ KATALOĞU (YOUTUBE CHIPS ÇUBUĞU) */
    .cat-bar{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;background:#fff;position:sticky;top:48px;z-index:240;border-bottom:1px solid #e5e5e5;scrollbar-width:none;-webkit-overflow-scrolling:touch;white-space:nowrap}
    .cat-bar::-webkit-scrollbar{display:none}
    .chip{flex-shrink:0;padding:6px 14px;border-radius:8px;font-size:.82rem;font-weight:500;border:none;background:rgba(0,0,0,.06);color:#0f0f0f;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s}
    .chip.ac{background:#0f0f0f;color:#fff;font-weight:600}

    /* VİDEO AKIŞI (16:9 - TÜM ESKİ ANDROID'LERLE UYUMLU) */
    .feed{display:flex;flex-direction:column;gap:16px;margin-top:4px}
    .vc{width:100%;cursor:pointer}
    .tw{position:relative;width:100%;height:0;padding-bottom:56.25%;background:#e0e0e0;overflow:hidden}
    .tw img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
    .db{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.8);color:#fff;font-size:.72rem;font-weight:600;padding:2px 5px;border-radius:4px;z-index:2}
    .vd{display:flex;gap:12px;padding:12px 14px 6px}
    .ca{width:38px;height:38px;border-radius:50%;background:#eee;flex-shrink:0;object-fit:cover}
    .mc{flex:1}
    .vt{font-size:.95rem;font-weight:500;line-height:1.35;color:#0f0f0f;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
    .vs{font-size:.78rem;color:#606060}

    /* İZLEME EKRANI (16:9 - ANDROID 9'DA VİDEONUN YARIM ÇIKMASINI ÖNLER) */
    .wv{display:none;position:fixed;top:0;left:0;right:0;bottom:52px;background:#fff;z-index:200;overflow-y:auto}
    .pw{width:100%;height:0;padding-bottom:56.25%;position:sticky;top:0;z-index:201;background:#000;overflow:hidden}
    .pw iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
    .wi{padding:14px;border-bottom:1px solid #e5e5e5}
    .wtt{font-size:1.05rem;font-weight:600;line-height:1.35;color:#0f0f0f}
    .wm{font-size:.78rem;color:#606060;margin-top:4px}
    .wcr{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
    .wcl{display:flex;align-items:center;gap:10px;cursor:pointer}
    .wav{width:40px;height:40px;border-radius:50%;object-fit:cover}
    .wcn{font-size:.92rem;font-weight:600}
    .bsub{background:#0f0f0f;color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:.82rem;font-weight:600;cursor:pointer}
    .bsub.sd{background:#f2f2f2;color:#0f0f0f}

    /* BUTONLAR VE KÜÇÜK OYNATICI (MINIPLAYER) MODU */
    .w-fs-btn{background:#f2f2f2;border:none;border-radius:16px;padding:5px 12px;font-size:.78rem;font-weight:600;color:#0f0f0f;display:flex;align-items:center;gap:6px;cursor:pointer}
    .w-drag-bar{position:absolute;top:0;left:0;right:0;height:44px;z-index:210;display:flex;align-items:center;padding:0 10px;background:linear-gradient(to bottom,rgba(0,0,0,0.55),transparent);pointer-events:auto}
    .w-down-btn{background:none;border:none;color:#fff;font-size:1.25rem;cursor:pointer;padding:6px 8px;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.8));display:flex;align-items:center;justify-content:center}

    /* KÜÇÜK OYNATICI (YOUTUBE MINIPLAYER) */
    #wV{transition:transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.22s, width 0.25s, height 0.25s, border-radius 0.25s}
    #wV.mini{
      display:block!important;
      position:fixed!important;
      top:auto!important;
      left:auto!important;
      right:12px!important;
      bottom:62px!important;
      width:180px!important;
      height:101px!important;
      border-radius:12px!important;
      overflow:hidden!important;
      box-shadow:0 8px 24px rgba(0,0,0,0.5)!important;
      background:#000!important;
      z-index:295!important;
      border:1px solid rgba(255,255,255,0.2)!important;
      cursor:pointer!important;
      touch-action:none;
      will-change:transform,opacity;
    }
    #wV.mini .pw{
      position:absolute!important;
      top:0!important;
      left:0!important;
      width:100%!important;
      height:100%!important;
      padding-bottom:0!important;
    }
    #wV.mini .pw iframe{
      width:100%!important;
      height:100%!important;
      pointer-events:none!important;
    }
    #wV.mini .w-drag-bar,
    #wV.mini .wi,
    #wV.mini > div:not(.pw):not(.mini-ctrls),
    #wV.mini #relL{
      display:none!important;
    }
    .mini-ctrls{
      display:none;
      position:absolute;
      top:0;left:0;right:0;bottom:0;
      z-index:220;
      background:transparent;
    }
    #wV.mini .mini-ctrls{
      display:flex;
      align-items:flex-start;
      justify-content:flex-end;
      padding:6px;
    }
    .mini-close-btn{
      background:rgba(0,0,0,0.7);
      color:#fff;
      border:none;
      border-radius:50%;
      width:26px;
      height:26px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:.9rem;
      cursor:pointer;
      backdrop-filter:blur(4px);
    }

    /* BÜYÜT SİMGESİNE BASILDIĞINDA TAM EKRAN YAN MOD */
    body.in-fs-landscape #wV{position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:100vw!important;height:100vh!important;background:#000!important;z-index:99999!important;overflow:hidden!important;padding:0!important}
    body.in-fs-landscape #wV .pw{position:fixed!important;top:0!important;left:0!important;width:100vw!important;height:100vh!important;padding-bottom:0!important;aspect-ratio:auto!important;z-index:100000!important}
    body.in-fs-landscape #wV .pw iframe{width:100vw!important;height:100vh!important;border:none!important}
    body.in-fs-landscape #wV .wi,body.in-fs-landscape #wV>div:not(.pw),body.in-fs-landscape #wV #relL,body.in-fs-landscape .yt-h,body.in-fs-landscape .bn{display:none!important}

    /* TELEFON YATAY ÇEVRİLDİĞİNDE OTOMATİK TAM EKRAN */
    @media (orientation: landscape) {
      body.in-watch #wV {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background: #000 !important;
        z-index: 99999 !important;
        overflow: hidden !important;
        padding: 0 !important;
      }
      body.in-watch #wV .pw {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        padding-bottom: 0 !important;
        aspect-ratio: auto !important;
        z-index: 100000 !important;
      }
      body.in-watch #wV .pw iframe {
        width: 100vw !important;
        height: 100vh !important;
        border: none !important;
      }
      body.in-watch #wV .wi,
      body.in-watch #wV > div:not(.pw),
      body.in-watch #wV #relL,
      body.in-watch .yt-h,
      body.in-watch .bn {
        display: none !important;
      }
    }

    /* KANAL SAYFASI VE KANAL SEKMELERİ */
    .cv{display:none;position:fixed;top:0;left:0;right:0;bottom:52px;background:#fff;z-index:210;overflow-y:auto}
    .ch{padding:24px 16px;text-align:center;border-bottom:1px solid #e5e5e5}
    .ch img{width:75px;height:75px;border-radius:50%;margin-bottom:10px;object-fit:cover}
    .ch h2{font-size:1.25rem}
    .c-tabs{display:flex;border-bottom:1px solid #e5e5e5;background:#fff;position:sticky;top:0;z-index:10}
    .ctab{flex:1;padding:12px 0;border:none;background:none;font-size:.95rem;font-weight:500;color:#606060;cursor:pointer;border-bottom:2px solid transparent;text-align:center}
    .ctab.ac{color:#0f0f0f;font-weight:700;border-bottom:2px solid #0f0f0f}

    /* SHORTS TAM EKRAN VE KAYDIRMA ALANI (Üst bar ve Alt bar arasında tam oturur) */
    .sv{display:none;position:fixed;top:48px;left:0;right:0;bottom:52px;background:#000;z-index:150;overflow:hidden}
    .sfw{width:100%;height:100%;position:relative;overflow:hidden;will-change:transform;transform:translate3d(0,0,0);-webkit-transform:translate3d(0,0,0);-webkit-backface-visibility:hidden;backface-visibility:hidden}
    .s-poster{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;filter:brightness(0.9)}
    .sfw iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;z-index:2}
    .s-touch-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;background:transparent;touch-action:none}
    .s-play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);width:70px;height:70px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:2rem;display:flex;align-items:center;justify-content:center;z-index:12;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}

    /* SHORTS BİLGİ VE BUTONLAR */
    .soi{position:absolute;bottom:25px;left:14px;right:75px;z-index:20;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);pointer-events:none}
    .soi *{pointer-events:auto}
    .scl{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .sav{width:36px;height:36px;border-radius:50%;object-fit:cover;cursor:pointer}
    .scn{font-weight:bold;font-size:.95rem;cursor:pointer}
    .sde{font-size:.88rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    
    .snc{position:absolute;bottom:30px;right:12px;z-index:20;display:flex;flex-direction:column;gap:14px;pointer-events:auto}
    .scb{width:46px;height:46px;border-radius:50%;background:rgba(30,30,30,.75);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:1.25rem;cursor:pointer;backdrop-filter:blur(4px)}
    .scb.liked{color:#ff0000}

    /* ABONELİKLER */
    .sab{display:flex;gap:14px;padding:12px 16px;overflow-x:auto;border-bottom:1px solid #e5e5e5;scrollbar-width:none}
    .sab::-webkit-scrollbar{display:none}
    .sai{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:62px;cursor:pointer}
    .sai img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid #065fd4}
    .sai span{font-size:.72rem;color:#606060;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ALT MENÜ */
    .bn{position:fixed;bottom:0;left:0;right:0;height:52px;background:#fff;border-top:1px solid #e5e5e5;display:flex;justify-content:space-around;align-items:center;z-index:300}
    .nb{background:none;border:none;color:#606060;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.65rem;cursor:pointer;width:33%}
    .nb i{font-size:1.25rem}
    .nb.ac{color:#0f0f0f;font-weight:bold}

    /* ARAMA KANAL KARTI */
    .scc{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #eee;background:#fafafa}
    .sci{display:flex;align-items:center;gap:14px;cursor:pointer}
    .sci img{width:56px;height:56px;border-radius:50%;object-fit:cover}

    /* YÜKLENME GÖSTERGESİ */
    .ld{text-align:center;padding:40px;color:#888;font-size:.9rem}
    .ldm{text-align:center;padding:20px;color:#888;font-size:.85rem}
  </style>
</head>
<body>

  <!-- ÜST BAR: 3. MADDE - YOUTUBE LOGOSUNA BASILINCA ANA SAYFAYA DÖNER -->
  <header class="yt-h">
    <div class="yt-logo" onclick="goHome()" title="Ana Sayfaya Dön">
      <i class="fa-brands fa-youtube"></i><span>YouTube</span>
    </div>
    <div class="hi">
      <i class="fa-solid fa-tower-broadcast"></i>
      <i class="fa-regular fa-bell"></i>
      <i class="fa-solid fa-magnifying-glass" onclick="openSrch()"></i>
      <div class="pav">Ö</div>
    </div>
  </header>

  <!-- ARAMA EKRANI (SON ARAMALAR VE ÖNERİLER) -->
  <div class="srch-overlay" id="srchW">
    <div class="srch-top">
      <button onclick="closeSrch()"><i class="fa-solid fa-arrow-left"></i></button>
      <input type="search" id="srchI" placeholder="@kanal veya video ara..." inputmode="search" autocomplete="off" oninput="renderSrchHist()" onkeydown="if(event.key==='Enter') doSrch()">
      <button onclick="doSrch()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
    <div id="srchHist" class="srch-hist"></div>
  </div>

  <!-- KATEGORİ KATALOĞU (YOUTUBE CHIPS) -->
  <div id="catBar" class="cat-bar">
    <button class="chip ac" onclick="selectCat('', this)">Tümü</button>
    <button class="chip" onclick="selectCat('Çiçek yetiştirme ve bahçe videoları', this)">Çiçek & Bahçe</button>
    <button class="chip" onclick="selectCat('Çiçekler', this)">Çiçekler</button>
    <button class="chip" onclick="selectCat('Pasta ve tatlı tarifleri', this)">Pasta & Tatlı</button>
    <button class="chip" onclick="selectCat('Örgü, dantel ve el işleri', this)">Örgü & El İşleri</button>
    <button class="chip" onclick="selectCat('Doğa ve manzara videoları', this)">Doğa & Manzara</button>
    <button class="chip" onclick="selectCat('Sevimli kedi ve hayvan videoları', this)">Sevimli Hayvanlar</button>
    <button class="chip" onclick="selectCat('Köy hayatı ve köy kahvaltıları', this)">Köy Hayatı</button>
    <button class="chip" onclick="selectCat('nefis yemek tarifleri', this)">Yemek Tarifleri</button>
    <button class="chip" onclick="selectCat('karadeniz şarkıları', this)">Karadeniz</button>
    <button class="chip" onclick="selectCat('huzur veren ilahiler', this)">İlahiler</button>
  </div>

  <div id="subBar" class="sab" style="display:none"></div>

  <!-- ANA SAYFA -->
  <main id="vList" class="feed"></main>

  <!-- İZLEME -->
  <div id="wV" class="wv" onclick="if(this.classList.contains('mini')) maximizeVideo(event)">
    <div class="pw" id="playerWrap">
      <div class="w-drag-bar" id="wDragBar">
        <button class="w-down-btn" onclick="minimizeVideo()" title="Küçült"><i class="fa-solid fa-chevron-down"></i></button>
      </div>
      <iframe id="wIf" allowfullscreen allow="autoplay"></iframe>
    </div>
    <div class="mini-ctrls" id="miniCtrls">
      <button class="mini-close-btn" onclick="event.stopPropagation();closeW(false)" title="Kapat">&times;</button>
    </div>
    <div class="wi" id="wInfo">
      <div id="wTt" class="wtt"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
        <div class="wm" id="wMt">İzleniyor</div>
        <button class="w-fs-btn" onclick="toggleFullScreenLandscape()">
          <i class="fa-solid fa-expand"></i> <span>Tam Ekran (Yan)</span>
        </button>
      </div>
      <div class="wcr">
        <div class="wcl" onclick="openChan(curVC,curVU,curVA)">
          <img id="wAv" class="wav" src="">
          <div class="wcn" id="wCh"></div>
        </div>
        <button id="wSb" class="bsub" onclick="togSub(curVC,curVU,curVA)">Abone Ol</button>
      </div>
    </div>
    <div style="font-weight:bold;padding:12px 14px 4px;font-size:.95rem">Sıradaki Videolar</div>
    <div id="relL" class="feed"></div>
  </div>

  <!-- KANAL -->
  <div id="cV" class="cv">
    <div style="padding:12px 14px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:15px">
      <button onclick="closeChan()" style="background:none;border:none;font-size:1.2rem"><i class="fa-solid fa-arrow-left"></i></button>
      <span style="font-weight:600" id="cpTt">Kanal</span>
    </div>
    <div class="ch">
      <img id="cpAv" src="">
      <h2 id="cpNm"></h2>
      <div style="margin:12px 0"><button id="cpSb" class="bsub" onclick="togSub(curCN,curCU,curCA)">Abone Ol</button></div>
    </div>
    <div class="c-tabs">
      <button id="ctV" class="ctab ac" onclick="setChanTab('videos')">Videolar</button>
      <button id="ctS" class="ctab" onclick="setChanTab('shorts')">Shorts</button>
    </div>
    <div id="cVL" class="feed"></div>
    <div id="cSL" class="feed" style="display:none"></div>
  </div>

  <!-- SHORTS -->
  <div id="sV" class="sv">
    <div class="sfw" id="sWrapper">
      <img id="sPoster" class="s-poster" src="" alt="">
      <iframe id="sIf" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      <div id="sTouch" class="s-touch-layer"></div>
      <div id="sPlayIcon" class="s-play-icon"></div>

      <div class="soi">
        <div class="scl">
          <img id="sAv" class="sav" src="" onclick="openChan(curSC,'',curSA)">
          <span id="sCh" class="scn" onclick="openChan(curSC,'',curSA)"></span>
          <button id="sSb" class="bsub" style="padding:4px 10px;font-size:.75rem" onclick="togSub(curSC,'',curSA)">Abone Ol</button>
        </div>
        <div id="sTt" class="sde"></div>
      </div>

      <div class="snc">
        <button class="scb" onclick="slidePrev()"><i class="fa-solid fa-chevron-up"></i></button>
        <button class="scb" onclick="slideNext()"><i class="fa-solid fa-chevron-down"></i></button>
        <button class="scb" id="sLikeBtn" onclick="toggleShortLike()"><i class="fa-solid fa-thumbs-up"></i></button>
      </div>
    </div>
  </div>

  <!-- UYGULAMAYI YÜKLE BİLDİRİMİ (Tarayıcı kurulumu desteklediğinde çıkar) -->
  <div id="instB" style="display:none;position:fixed;bottom:64px;left:12px;right:12px;background:#0f0f0f;color:#fff;padding:10px 14px;border-radius:12px;z-index:400;box-shadow:0 4px 16px rgba(0,0,0,0.35);align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:10px">
      <img src="https://www.gstatic.com/youtube/img/branding/favicon/favicon_192x192_v2.png" style="width:34px;height:34px;border-radius:8px">
      <div>
        <div style="font-weight:600;font-size:.88rem">YouTube</div>
        <div style="font-size:.72rem;color:#aaa">Uygulamayı telefona yükleyin</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button onclick="doInstall()" style="background:#cc0000;color:#fff;border:none;padding:6px 14px;border-radius:18px;font-weight:bold;font-size:.78rem;cursor:pointer">Yükle</button>
      <button onclick="gid('instB').style.display='none'" style="background:none;border:none;color:#aaa;font-size:1.2rem;cursor:pointer;padding:0 4px">&times;</button>
    </div>
  </div>

  <!-- ALT MENÜ -->
  <nav class="bn">
    <button class="nb ac" id="bH" onclick="nav('home')"><i class="fa-solid fa-house"></i><span>Ana Sayfa</span></button>
    <button class="nb" id="bS" onclick="nav('shorts')"><i class="fa-solid fa-bolt"></i><span>Shorts</span></button>
    <button class="nb" id="bA" onclick="nav('subs')"><i class="fa-brands fa-youtube"></i><span>Abonelikler</span></button>
  </nav>

  <script>
    // PIPED API - SINIRSIZ ve KOTASIZ
    const P = "https://api.piped.private.coffee";
    const KW = [
      "çiçek yetiştirme ve bahçe videoları",
      "çiçekler",
      "pasta ve tatlı tarifleri",
      "örgü dantel ve el işleri",
      "doğa ve manzara videoları",
      "sevimli kedi ve hayvan videoları",
      "köy hayatı ve köy kahvaltıları",
      "çiçek bakımı püf noktaları",
      "nefis yemek tarifleri",
      "karadeniz şarkıları",
      "rize yaylalar",
      "huzur veren ilahiler",
      "karadeniz türküsü"
    ];

    const SHORT_KW = [
      "çiçek bakımı #shorts",
      "bahçe çiçekleri #shorts",
      "pasta tarifleri #shorts",
      "örgü modelleri #shorts",
      "doğa manzaraları #shorts",
      "sevimli kediler #shorts",
      "köy hayatı #shorts",
      "karadeniz #shorts",
      "rize #shorts",
      "nefis yemek tarifleri #shorts",
      "huzur veren ilahiler #shorts"
    ];

    let curNav='home', curVC='', curVU='', curVA='';
    let curCN='', curCU='', curCA='';
    let curSC='', curSA='';
    let sL=[], sI=0;

    let nextPageToken = null;
    let lastQuery = '';
    let isLoadingMore = false;
    let currentFeedTarget = 'vList';
    let currentCat = '';

    // KATEGORİ KATALOĞUNDAN SEÇİM YAPMA (YOUTUBE CHIPS)
    async function selectCat(cat, btn){
      currentCat = cat;
      document.querySelectorAll('#catBar .chip').forEach(b => b.classList.remove('ac'));
      if(btn) btn.classList.add('ac');

      if(!cat){
        loadHome();
        return;
      }

      var f = gid("vList");
      f.innerHTML = `<div class="ld">"${cat}" videoları yükleniyor...</div>`;
      nextPageToken = null;
      lastQuery = cat;
      currentFeedTarget = 'vList';

      try{
        var r = await fetch(`${P}/search?q=${encodeURIComponent(cat)}&filter=videos`);
        var d = await r.json();
        var items = (d.items || []).filter(i => i.type === 'stream');
        nextPageToken = d.nextpage || null;

        f.innerHTML = "";
        if(!items.length){
          f.innerHTML = `<div class="ld">Bu kategoride video bulunamadı.</div>`;
          return;
        }

        renderFeed(f, items, false);
      }catch(e){
        f.innerHTML = `<div class="ld">Videolar yüklenemedi. Tekrar deneyin.</div>`;
      }
    }

    // 3. MADDE: YOUTUBE LOGOSUNA BASINCA HER YERDEN ANA SAYFAYA DÖN
    function goHome(){
      if(document.body.classList.contains('in-watch')){
        minimizeVideo();
      }
      closeChan(false);
      closeSrch();
      currentCat = '';
      document.querySelectorAll('#catBar .chip').forEach((b, i) => {
        if(i === 0) b.classList.add('ac');
        else b.classList.remove('ac');
      });
      nav('home');
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // Telefon geri tuşu
    window.addEventListener('popstate', function(){
      if(document.body.classList.contains('in-fs-landscape')){
        toggleFullScreenLandscape();
        return;
      }
      if(gid("cV").style.display==="block") closeChan(false);
      else if(gid("wV").style.display==="block"){
        if(!gid("wV").classList.contains('mini')){
          minimizeVideo();
        } else {
          closeW(false);
        }
      }
      else if(curNav === 'shorts') nav('home');
      else if(gid("srchW").style.display==="flex") closeSrch();
    });

    // SONSUZ KAYDIRMA - Sayfa dibine gelince yeni video yükle
    window.addEventListener('scroll', function(){
      if(isLoadingMore || !nextPageToken) return;
      if(curNav !== 'home' && curNav !== 'search') return;
      if((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600){
        loadMore();
      }
    });

    function gid(id){return document.getElementById(id)}
    function getSubs(){return JSON.parse(localStorage.getItem('yt_s3')||'[]')}
    function saveSubs(s){localStorage.setItem('yt_s3',JSON.stringify(s))}
    function vid(u){if(!u)return'';if(u.includes('v='))return u.split('v=')[1].split('&')[0];return u.replace('/watch?v=','')}
    function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}
    function fmtD(s){if(!s||s<0)return'';var m=Math.floor(s/60),sc=Math.floor(s%60);return m+':'+(sc<10?'0':'')+sc}
    function fmtV(v){if(!v||v<0)return'';if(v>=1e6)return Math.floor(v/1e6)+'M';if(v>=1e3)return Math.floor(v/1e3)+'B';return v+''}

    // EN YENİDEN ESKİYE DOĞRU SIRALAMA FONKSİYONU
    function sortNewest(videos){
      return videos.sort((a, b) => {
        if(a.duration === -1 && b.duration !== -1) return -1;
        if(b.duration === -1 && a.duration !== -1) return 1;
        return (b.uploaded || 0) - (a.uploaded || 0);
      });
    }

    // 1. ANA SAYFA: Abone olunan kanallardan yeni yüklenen videolar en başta, ardından kategoriler harmanlanır
    async function loadHome(){
      var f=gid("vList");
      f.innerHTML=`<div class="ld">Videolar yükleniyor...</div>`;
      nextPageToken=null;
      currentFeedTarget='vList';

      var s = getSubs();
      var subPromises = [];

      // Abone olunan TÜM kanallardan en yeni videoları çek (en fazla 12 kanal)
      if(s.length > 0){
        s.slice(0, 12).forEach(sub => {
          subPromises.push(
            fetch(`${P}/search?q=${encodeURIComponent(sub.name)}&filter=all`)
              .then(r => r.json())
              .then(d => {
                var streams = (d.items || []).filter(i => i.type === 'stream');
                var matched = streams.filter(i => 
                  (i.uploaderName||'').toLowerCase().includes(sub.name.toLowerCase()) || 
                  sub.name.toLowerCase().includes((i.uploaderName||'').toLowerCase())
                );
                return matched.length > 0 ? matched.slice(0, 4) : streams.slice(0, 2);
              })
              .catch(() => [])
          );
        });
      }

      // İzin verilen / benzer konulardan da video çek (karadeniz, çiçek, yemek, ilahi)
      var shuffledKW = [...KW].sort(() => 0.5 - Math.random());
      var q1 = shuffledKW[0];
      var q2 = shuffledKW[1];
      lastQuery = q1;

      var kwPromises = [
        fetch(`${P}/search?q=${encodeURIComponent(q1)}&filter=videos`).then(r=>r.json()).catch(()=>({items:[]})),
        fetch(`${P}/search?q=${encodeURIComponent(q2)}&filter=videos`).then(r=>r.json()).catch(()=>({items:[]}))
      ];

      try{
        var [subResults, kwResults] = await Promise.all([
          Promise.all(subPromises),
          Promise.all(kwPromises)
        ]);

        var subVideos = [];
        var subSeen = new Set();
        subResults.forEach(arr => {
          arr.forEach(item => {
            var id = vid(item.url);
            if(id && !subSeen.has(id)){
              subSeen.add(id);
              subVideos.push(item);
            }
          });
        });

        // 1. MADDE: Abone olunan kanalların videolarını en yeniden eskiye sırala
        sortNewest(subVideos);

        var kwVideos = []
          .concat((kwResults[0].items||[]).filter(i=>i.type==='stream'))
          .concat((kwResults[1].items||[]).filter(i=>i.type==='stream'));
        kwVideos.sort(() => 0.5 - Math.random());

        nextPageToken = kwResults[0].nextpage || kwResults[1].nextpage || null;

        var mixedFeed = [];
        var seenIds = new Set();

        // 1. MADDE: Abone olduğumuz kanallardan yeni video yüklendiğinde ANA SAYFADA EN BAŞTA GÖRÜNSÜN
        var topSubCount = Math.min(3, subVideos.length);
        for(var i = 0; i < topSubCount; i++){
          var sid = vid(subVideos[i].url);
          if(sid && !seenIds.has(sid)){
            seenIds.add(sid);
            mixedFeed.push(subVideos[i]);
          }
        }

        // Kalan abone videoları ve kategori videolarını dengeli harmanla
        var subRest = subVideos.slice(topSubCount);
        var maxLen = Math.max(subRest.length, kwVideos.length);

        for(var i = 0; i < maxLen; i++){
          if(kwVideos[i*2]){
            var k1id = vid(kwVideos[i*2].url);
            if(k1id && !seenIds.has(k1id)){
              seenIds.add(k1id);
              mixedFeed.push(kwVideos[i*2]);
            }
          }
          if(subRest[i]){
            var srid = vid(subRest[i].url);
            if(srid && !seenIds.has(srid)){
              seenIds.add(srid);
              mixedFeed.push(subRest[i]);
            }
          }
          if(kwVideos[i*2+1]){
            var k2id = vid(kwVideos[i*2+1].url);
            if(k2id && !seenIds.has(k2id)){
              seenIds.add(k2id);
              mixedFeed.push(kwVideos[i*2+1]);
            }
          }
        }

        if(mixedFeed.length < 8) mixedFeed = kwVideos.length > 0 ? kwVideos : subVideos;

        renderFeed(f, mixedFeed, false);
      }catch(e){
        f.innerHTML=`<div class="ld">Bağlantı hatası. Tekrar deneyin.</div>`;
      }
    }

    // SONSUZ KAYDIRMA: DAHA FAZLA VİDEO YÜKLE
    async function loadMore(){
      if(isLoadingMore||!nextPageToken) return;
      isLoadingMore=true;

      var f=gid(currentFeedTarget);
      var ldDiv=document.createElement('div');
      ldDiv.className='ldm';
      ldDiv.id='loadingMore';
      ldDiv.textContent='Daha fazla video yükleniyor...';
      f.appendChild(ldDiv);

      try{
        var r=await fetch(`${P}/nextpage/search?q=${encodeURIComponent(lastQuery)}&filter=videos&nextpage=${encodeURIComponent(nextPageToken)}`);
        var d=await r.json();
        var items=(d.items||[]).filter(i=>i.type==='stream');
        nextPageToken=d.nextpage||null;

        var lm=gid('loadingMore');
        if(lm) lm.remove();

        items.forEach(item=>appendCard(f,item));
      }catch(e){
        var lm=gid('loadingMore');
        if(lm) lm.remove();
      }
      isLoadingMore=false;
    }

    // 2. MADDE: TÜRKÇE TARİH DÖNÜŞTÜRÜCÜ (EKSİKSİZ TÜM İNGİLİZCE İFADELERİ KALDIRIR VE TÜRKÇE YAPAR)
    function trDate(str, uploadedMs){
      // Canlı yayın kontrolü
      if(uploadedMs === -1 || (str && /(live|canlı)/i.test(str) && !/(streamed|ago|önce|yayınlandı)/i.test(str))){
        return "Canlı";
      }
      if(str && /^upcoming$/i.test(str.trim())){
        return "Yakında";
      }

      // Milisaniye zaman damgası varsa en doğru Türkçe süre hesabı
      if(uploadedMs && typeof uploadedMs === 'number' && uploadedMs > 1000000000){
        var diff = Date.now() - uploadedMs;
        if(diff < 60000 && diff >= -180000) return "az önce";
        if(diff >= 60000 && diff < 315360000000){
          var min = Math.floor(diff / 60000);
          var hrs = Math.floor(min / 60);
          var days = Math.floor(hrs / 24);
          var weeks = Math.floor(days / 7);
          var months = Math.floor(days / 30);
          var years = Math.floor(days / 365);

          if(min < 60) return min + " dakika önce";
          if(hrs < 24) return hrs + " saat önce";
          if(days < 7) return days + " gün önce";
          if(weeks < 5) return weeks + " hafta önce";
          if(months < 12) return months + " ay önce";
          return years + " yıl önce";
        }
      }

      if(!str) return "";

      // String metin fall-back çevirisi
      var s = str.trim();
      if(/^(live|live now)$/i.test(s)) return "Canlı";
      if(/^upcoming$/i.test(s)) return "Yakında";

      return s
        .replace(/Streamed\s+live\s+/gi, '')
        .replace(/Streamed\s+/gi, '')
        .replace(/Premiered\s+/gi, '')
        .replace(/live\s+/gi, '')
        .replace(/hours?\s+ago/gi, 'saat önce')
        .replace(/days?\s+ago/gi, 'gün önce')
        .replace(/minutes?\s+ago/gi, 'dakika önce')
        .replace(/seconds?\s+ago/gi, 'saniye önce')
        .replace(/weeks?\s+ago/gi, 'hafta önce')
        .replace(/months?\s+ago/gi, 'ay önce')
        .replace(/years?\s+ago/gi, 'yıl önce')
        .replace(/yesterday/gi, 'dün')
        .replace(/just now/gi, 'az önce')
        .replace(/moments\s+ago/gi, 'az önce')
        .replace(/an\s+hour\s+ago/gi, '1 saat önce')
        .replace(/a\s+day\s+ago/gi, '1 gün önce')
        .replace(/a\s+week\s+ago/gi, '1 hafta önce')
        .replace(/a\s+month\s+ago/gi, '1 ay önce')
        .replace(/a\s+year\s+ago/gi, '1 yıl önce')
        .trim();
    }

    function renderFeed(c,items,append){
      if(!append) c.innerHTML="";
      if(!items||items.length===0){
        if(!append) c.innerHTML=`<div class="ld">Video bulunamadı.</div>`;
        return;
      }
      items.forEach(item=>appendCard(c,item));
    }

    function appendCard(c,item,isShortItem){
      var id=vid(item.url);
      if(!id) return;
      var t=item.title, ch=item.uploaderName||'', cu=item.uploaderUrl||'';
      var th=item.thumbnail||'';
      var av=item.uploaderAvatar||`https://ui-avatars.com/api/?name=${encodeURIComponent(ch)}&background=f0f0f0&color=333`;
      var vw=fmtV(item.views), dur=fmtD(item.duration);
      var ud=trDate(item.uploadedDate, item.uploaded);

      var clickAct = isShortItem ? 
        `openShortItem('${id}','${esc(t)}','${esc(ch)}','${av}')` :
        `openW('${id}','${esc(t)}','${esc(ch)}','${cu}','${av}','${vw}','${esc(ud)}')`;

      var card=document.createElement("div");
      card.className="vc";
      card.innerHTML=`
        <div class="tw" onclick="${clickAct}">
          <img src="${th}" loading="lazy">
          ${dur?`<div class="db">${dur}</div>`:''}
        </div>
        <div class="vd">
          <img class="ca" src="${av}" onclick="event.stopPropagation();openChan('${esc(ch)}','${cu}','${av}')">
          <div class="mc" onclick="${clickAct}">
            <div class="vt">${t}</div>
            <div class="vs">${ch}${vw?' • '+vw+' görüntüleme':''}${ud?' • '+ud:''}</div>
          </div>
        </div>`;
      c.appendChild(card);
    }

    // 2. VİDEO İZLEME
    function openW(id,t,ch,cu,av,vw,ud){
      history.pushState({v:'w'},'');
      curVC=ch;curVU=cu;curVA=av;
      var w = gid("wV");
      w.classList.remove('mini');
      w.style.transform = '';
      w.style.opacity = '';
      document.body.classList.remove('in-mini');
      document.body.classList.add('in-watch');
      gid("wIf").src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1`;
      gid("wTt").textContent=t;
      gid("wCh").textContent=ch;
      gid("wAv").src=av;
      gid("wMt").textContent=(vw?vw+' görüntüleme • ':'') + (ud?ud:'İzleniyor');
      updSub("wSb",ch);
      w.style.display="block";
      w.scrollTop=0;
      loadRel(id,t,ch);
      checkOrientation();
    }

    // BÜYÜT SİMGESİNE TIKLANDIĞINDA TAM EKRAN VE YATAY YAPAR
    function toggleFullScreenLandscape(){
      var body = document.body;
      var pw = gid("playerWrap");
      var isFs = body.classList.contains('in-fs-landscape');

      if(isFs){
        body.classList.remove('in-fs-landscape');
        if(document.fullscreenElement && document.exitFullscreen){
          document.exitFullscreen().catch(()=>{});
        }
        if(screen.orientation && screen.orientation.unlock){
          screen.orientation.unlock();
        }
      } else {
        body.classList.add('in-fs-landscape');
        if(pw && pw.requestFullscreen){
          pw.requestFullscreen().catch(()=>{});
        }
        if(screen.orientation && screen.orientation.lock){
          screen.orientation.lock('landscape').catch(()=>{});
        }
      }
    }

    function closeW(pop){
      var w = gid("wV");
      document.body.classList.remove('in-watch');
      document.body.classList.remove('in-fs-landscape');
      document.body.classList.remove('in-mini');
      if(screen.orientation && screen.orientation.unlock){
        screen.orientation.unlock();
      }
      if(w){
        w.classList.remove('mini');
        w.style.transform = '';
        w.style.opacity = '';
        w.style.display="none";
      }
      gid("wIf").src="";
      if(document.fullscreenElement){
        document.exitFullscreen().catch(()=>{});
      }
      if(pop!==false&&history.state&&history.state.v==='w') history.back();
    }

    // YOUTUBE MOBİL GİBİ VİDEO KÜÇÜLTME (MINIPLAYER) FONKSİYONLARI VE JESTLER
    function minimizeVideo(){
      var w = gid("wV");
      if(!w || w.style.display !== "block") return;
      document.body.classList.remove('in-watch');
      document.body.classList.remove('in-fs-landscape');
      document.body.classList.add('in-mini');
      w.style.transform = '';
      w.style.opacity = '';
      w.classList.add('mini');
    }

    function maximizeVideo(e){
      if(e && e.target && e.target.closest && e.target.closest('.mini-close-btn')) return;
      var w = gid("wV");
      if(!w) return;
      w.style.transform = '';
      w.style.opacity = '';
      w.classList.remove('mini');
      document.body.classList.remove('in-mini');
      document.body.classList.add('in-watch');
    }

    // DOKUNMATİK JESTLER: Aşağı kaydırarak küçültme & Yukarı kaydırarak kapatma
    (function setupVideoMiniGestures(){
      var wV = gid("wV");
      var pWrap = gid("playerWrap");
      var wInfo = gid("wInfo");
      var miniCtrls = gid("miniCtrls");

      var startY = 0, startX = 0, diffY = 0, diffX = 0;
      var isDraggingDown = false;
      var isMiniDraggingUp = false;

      // 1. TAM EKRANDAYKEN AŞAĞI KAYDIRINCA KÜÇÜK OYNATICIYA DÖNÜŞTÜR
      function onWatchTouchStart(e){
        if(wV.classList.contains('mini') || e.touches.length !== 1) return;
        if(wV.scrollTop > 8) return;
        startY = e.touches[0].clientY;
        startX = e.touches[0].clientX;
        diffY = 0;
        diffX = 0;
        isDraggingDown = true;
        wV.style.transition = 'none';
      }

      function onWatchTouchMove(e){
        if(!isDraggingDown || e.touches.length !== 1) return;
        diffY = e.touches[0].clientY - startY;
        diffX = e.touches[0].clientX - startX;

        // Yalnızca aşağı doğru çekiliyorsa
        if(diffY > 10 && diffY > Math.abs(diffX)){
          var clamped = Math.min(diffY, 180);
          wV.style.transform = `translate3d(0, ${clamped}px, 0)`;
          wV.style.opacity = Math.max(0.65, 1 - (diffY / 450));
        }
      }

      function onWatchTouchEnd(e){
        if(!isDraggingDown) return;
        isDraggingDown = false;
        wV.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.22s';

        // 40 pikselden fazla aşağı kaydırıldıysa küçült
        if(diffY > 40 && diffY > Math.abs(diffX)){
          minimizeVideo();
        } else {
          wV.style.transform = '';
          wV.style.opacity = '';
        }
      }

      // 2. KÜÇÜK OYNATICIYI YUKARI KAYDIRARAK KAPATMA
      function onMiniTouchStart(e){
        if(!wV.classList.contains('mini') || e.touches.length !== 1) return;
        startY = e.touches[0].clientY;
        startX = e.touches[0].clientX;
        diffY = 0;
        diffX = 0;
        isMiniDraggingUp = true;
        wV.style.transition = 'none';
      }

      function onMiniTouchMove(e){
        if(!isMiniDraggingUp || e.touches.length !== 1) return;
        diffY = e.touches[0].clientY - startY;
        diffX = e.touches[0].clientX - startX;

        // Yukarı kaydırma
        if(diffY < 0){
          wV.style.transform = `translate3d(0, ${diffY}px, 0)`;
          wV.style.opacity = Math.max(0.1, 1 + (diffY / 120));
        }
      }

      function onMiniTouchEnd(e){
        if(!isMiniDraggingUp) return;
        isMiniDraggingUp = false;

        // Yukarı 30 pikselden fazla kaydırıldıysa kapat
        if(diffY < -30 && Math.abs(diffY) > Math.abs(diffX)){
          wV.style.transition = 'transform 0.18s ease-out, opacity 0.18s ease-out';
          wV.style.transform = 'translate3d(0, -120px, 0)';
          wV.style.opacity = '0';
          setTimeout(function(){
            closeW(false);
          }, 180);
        } else if(Math.abs(diffY) < 10 && Math.abs(diffX) < 10){
          // Tıklama gibi dokunulduysa tam ekrana aç
          maximizeVideo();
        } else {
          // Geri eski yerine oturt
          wV.style.transition = 'transform 0.18s ease-out, opacity 0.18s ease-out';
          wV.style.transform = 'translate3d(0, 0, 0)';
          wV.style.opacity = '1';
        }
      }

      pWrap.addEventListener('touchstart', onWatchTouchStart, { passive: true });
      pWrap.addEventListener('touchmove', onWatchTouchMove, { passive: true });
      pWrap.addEventListener('touchend', onWatchTouchEnd);

      if(wInfo){
        wInfo.addEventListener('touchstart', onWatchTouchStart, { passive: true });
        wInfo.addEventListener('touchmove', onWatchTouchMove, { passive: true });
        wInfo.addEventListener('touchend', onWatchTouchEnd);
      }

      if(miniCtrls){
        miniCtrls.addEventListener('touchstart', onMiniTouchStart, { passive: true });
        miniCtrls.addEventListener('touchmove', onMiniTouchMove, { passive: true });
        miniCtrls.addEventListener('touchend', onMiniTouchEnd);
      }
    })();

    // 3. MADDE: İZLENEN VİDEONUN KONUSUNU TESPİT ET (Örn: Çiçek videosu ise sıradakiler çiçek olsun)
    function detectVideoTopic(title, channel){
      var lower = (title || '').toLowerCase();

      // 1. Çiçek & Bahçe Videoları
      if(lower.includes('çiçek') || lower.includes('cicek') || lower.includes('bahçe') || lower.includes('bahce') || lower.includes('orkide') || lower.includes('menekşe') || lower.includes('kaktüs') || lower.includes('sukulent') || lower.includes('saksı') || lower.includes('bitki') || lower.includes('yaprak') || lower.includes('sulama') || lower.includes('tohum') || lower.includes('fide')){
        var specials = ['barış çiçeği', 'paşa kılıcı', 'para çiçeği', 'salon bitkileri', 'orkide', 'menekşe', 'kaktüs', 'sukulent', 'antoryum', 'aloe vera', 'kalanşo', 'sardunya', 'bahçe bakımı', 'çiçek yetiştirme'];
        for(var i=0; i<specials.length; i++){
          if(lower.includes(specials[i])){
            return specials[i] + " bakımı";
          }
        }
        return "çiçek yetiştirme ve bahçe bakımı";
      }

      // 2. Pasta ve Tatlı Tarifleri
      if(lower.includes('pasta') || lower.includes('tatlı') || lower.includes('tatli') || lower.includes('kek') || lower.includes('kurabiye') || lower.includes('şerbet') || lower.includes('muhallebi') || lower.includes('sütlaç') || lower.includes('baklava') || lower.includes('çikolata') || lower.includes('brownie') || lower.includes('börek')){
        var cleanT = lower.replace(/[^a-zçğıöşü0-9\s]/gi, ' ').split(/\s+/).filter(w => w.length > 2 && !['nasıl', 'yapılır', 'kolay', 'pratik', 'nefis', 'tarifi', 'yemek'].includes(w));
        return (cleanT.slice(0, 3).join(' ') || "pasta ve tatlı") + " tarifi";
      }

      // 3. Örgü, Dantel ve El İşleri
      if(lower.includes('örgü') || lower.includes('orgu') || lower.includes('dantel') || lower.includes('el işi') || lower.includes('elisi') || lower.includes('tığ') || lower.includes('şiş') || lower.includes('motif') || lower.includes('patik') || lower.includes('yelek') || lower.includes('lif') || lower.includes('oya') || lower.includes('iğne oyası') || lower.includes('nakış') || lower.includes('dikiş') || lower.includes('kanaviçe')){
        return "örgü dantel ve el işleri modelleri";
      }

      // 4. Doğa ve Manzara Videoları
      if(lower.includes('doğa') || lower.includes('doga') || lower.includes('manzara') || lower.includes('orman') || lower.includes('şelale') || lower.includes('selale') || lower.includes('nehir') || lower.includes('göl') || lower.includes('dağ') || lower.includes('kuş sesleri') || lower.includes('su sesi') || lower.includes('tabiat')){
        return "doğa ve manzara videoları huzur";
      }

      // 5. Sevimli Kedi ve Hayvan Videoları
      if(lower.includes('kedi') || lower.includes('köpek') || lower.includes('hayvan') || lower.includes('pati') || lower.includes('yavru kedi') || lower.includes('kediler') || lower.includes('köpekler') || lower.includes('kuş')){
        return "sevimli kedi ve hayvan videoları";
      }

      // 6. Köy Hayatı ve Köy Kahvaltıları
      if(lower.includes('köy hayatı') || lower.includes('koy hayati') || lower.includes('köy kahvaltısı') || lower.includes('koy kahvaltisi') || lower.includes('köyde yaşam') || lower.includes('köy') || lower.includes('çiftlik') || lower.includes('tandır') || lower.includes('odun ateşi') || lower.includes('organik yaşam')){
        return "köy hayatı ve köy kahvaltıları";
      }

      // 7. Yemek Tarifleri
      if(lower.includes('yemek') || lower.includes('tarif') || lower.includes('çorba') || lower.includes('köfte') || lower.includes('pilav')){
        return "nefis pratik yemek tarifleri";
      }

      // 8. Karadeniz & Rize
      if(lower.includes('karadeniz') || lower.includes('rize') || lower.includes('yayla') || lower.includes('tulum') || lower.includes('kemençe') || lower.includes('türkü') || lower.includes('horon') || lower.includes('trabzon') || lower.includes('artvin')){
        if(lower.includes('şarkı') || lower.includes('türkü') || lower.includes('müzik') || lower.includes('horon') || lower.includes('tulum')){
          return "karadeniz türküleri şarkıları";
        }
        return "rize karadeniz yaylaları";
      }

      // 9. Huzur & İlahi
      if(lower.includes('ilahi') || lower.includes('kuran') || lower.includes('dua') || lower.includes('ezan') || lower.includes('zikir')){
        return "huzur veren ilahiler dinle";
      }

      // 10. Belirli bir kanalın videosu ise başlıktan temiz 3-4 kelime ara
      var words = title.replace(/[\[\(\{\]\)\}\|#\-–—_!?:;\*\+~"'\.\,]/g, ' ')
                       .replace(/\s+/g, ' ')
                       .trim()
                       .split(' ')
                       .filter(w => w.length > 2 && !['official', 'video', 'full', 'hd', 'yeni', 'bölüm', 've', 'ile', 'için'].includes(w.toLowerCase()));
      if(words.length > 0){
        return words.slice(0, 4).join(' ');
      }
      return channel || "çiçek yetiştirme ve bahçe";
    }

    // 3. MADDE: SIRADAKİ VİDEOLAR İZLENEN VİDEONUN AYNISI/İLGİLİ KONUSU OLSUN (Farklı kanallardan harmanlanmış)
    async function loadRel(currentId, currentTitle, currentChannel){
      var r=gid("relL");

      var query = detectVideoTopic(currentTitle, currentChannel);

      try{
        var fetchArr = [
          fetch(`${P}/search?q=${encodeURIComponent(query)}&filter=videos`).then(res=>res.json()).catch(()=>({items:[]}))
        ];

        // İlgili kategoriyi zenginleştirmek için 2. arama
        if(lower.includes('çiçek') || lower.includes('cicek') || lower.includes('bahçe') || lower.includes('bitki')){
          fetchArr.push(fetch(`${P}/search?q=${encodeURIComponent("çiçek yetiştirme püf noktaları")}&filter=videos`).then(res=>res.json()).catch(()=>({items:[]})));
        } else if(lower.includes('pasta') || lower.includes('tatlı') || lower.includes('kek')){
          fetchArr.push(fetch(`${P}/search?q=${encodeURIComponent("en lezzetli pasta ve tatlı tarifleri")}&filter=videos`).then(res=>res.json()).catch(()=>({items:[]})));
        } else if(lower.includes('örgü') || lower.includes('dantel') || lower.includes('el işi')){
          fetchArr.push(fetch(`${P}/search?q=${encodeURIComponent("kolay örgü dantel modelleri")}&filter=videos`).then(res=>res.json()).catch(()=>({items:[]})));
        } else if(lower.includes('doğa') || lower.includes('manzara')){
          fetchArr.push(fetch(`${P}/search?q=${encodeURIComponent("harika doğa ve manzara görüntüleri")}&filter=videos`).then(res=>res.json()).catch(()=>({items:[]})));
        } else if(lower.includes('kedi') || lower.includes('hayvan')){
          fetchArr.push(fetch(`${P}/search?q=${encodeURIComponent("en komik ve sevimli kedi videoları")}&filter=videos`).then(res=>res.json()).catch(()=>({items:[]})));
        } else if(lower.includes('köy') || lower.includes('kahvaltı')){
          fetchArr.push(fetch(`${P}/search?q=${encodeURIComponent("köy hayatı doğal yaşam kahvaltı")}&filter=videos`).then(res=>res.json()).catch(()=>({items:[]})));
        } else if(lower.includes('yemek') || lower.includes('tarif')){
          fetchArr.push(fetch(`${P}/search?q=${encodeURIComponent("nefis pratik yemek tarifleri")}&filter=videos`).then(res=>res.json()).catch(()=>({items:[]})));
        } else if(lower.includes('karadeniz') || lower.includes('rize') || lower.includes('türkü')){
          fetchArr.push(fetch(`${P}/search?q=${encodeURIComponent("karadeniz müzikleri dinle")}&filter=videos`).then(res=>res.json()).catch(()=>({items:[]})));
        }

        var results = await Promise.all(fetchArr);
        var allItems = [];
        results.forEach(res => {
          allItems = allItems.concat((res.items || []).filter(i => i.type === 'stream'));
        });

        // İzlenmekte olan videoyu listeden çıkar
        allItems = allItems.filter(i => vid(i.url) !== currentId);

        // Tek bir kanaldan hepsi gelmesin, kanal başına en fazla 2 video alarak çeşitlendir
        var mixed = [];
        var chCounts = {};
        allItems.forEach(item => {
          var ch = item.uploaderName || 'Kanal';
          chCounts[ch] = (chCounts[ch] || 0);
          if(chCounts[ch] < 2){
            chCounts[ch]++;
            mixed.push(item);
          }
        });

        if(mixed.length < 8){
          allItems.forEach(item => {
            if(!mixed.includes(item)) mixed.push(item);
          });
        }

        renderFeed(r, mixed.slice(0, 12), false);
      }catch(e){
        r.innerHTML=`<div class="ld">Videolar yüklenemedi.</div>`;
      }
    }

    function getSearchHist(){
      try{ return JSON.parse(localStorage.getItem('yt_srch_hist') || '[]'); }catch(e){ return []; }
    }
    function saveSearchQuery(q){
      if(!q) return;
      var h = getSearchHist();
      h = h.filter(x => x.toLowerCase() !== q.toLowerCase());
      h.unshift(q);
      if(h.length > 12) h = h.slice(0, 12);
      localStorage.setItem('yt_srch_hist', JSON.stringify(h));
    }
    function removeSearchQuery(q, e){
      if(e) e.stopPropagation();
      var h = getSearchHist().filter(x => x.toLowerCase() !== q.toLowerCase());
      localStorage.setItem('yt_srch_hist', JSON.stringify(h));
      renderSrchHist();
    }
    function pickSearch(q){
      gid("srchI").value = q;
      doSrch(q);

    // 6. SHORTS (ÖN YÜKLEME + FARKLI KANALLAR + ANINDA HIZLI AÇILIŞ)
    let isShortPlaying = true;
    let isShortTransitioning = false;
    let preloadedShorts = [];
    let isPreloadingShorts = false;

    async function preloadShorts(){
      if(isPreloadingShorts) return;
      isPreloadingShorts = true;

      var shuffled = [...SHORT_KW].sort(() => 0.5 - Math.random());
      var k1 = shuffled[0] || "yemek tarifleri #shorts";
      var k2 = shuffled[1] || "karadeniz #shorts";
      var k3 = shuffled[2] || "çiçek bakımı #shorts";

      try {
        var [r1, r2, r3] = await Promise.all([
          fetch(`${P}/search?q=${encodeURIComponent(k1)}&filter=videos`).then(r=>r.json()).catch(()=>({items:[]})),
          fetch(`${P}/search?q=${encodeURIComponent(k2)}&filter=videos`).then(r=>r.json()).catch(()=>({items:[]})),
          fetch(`${P}/search?q=${encodeURIComponent(k3)}&filter=videos`).then(r=>r.json()).catch(()=>({items:[]}))
        ]);

        var all = []
          .concat((r1.items||[]).filter(i=>i.type==='stream'&&i.duration>0&&i.duration<=120))
          .concat((r2.items||[]).filter(i=>i.type==='stream'&&i.duration>0&&i.duration<=120))
          .concat((r3.items||[]).filter(i=>i.type==='stream'&&i.duration>0&&i.duration<=120));

        all.sort(() => 0.5 - Math.random());

        // 2. MADDE: AYNI KANALDAN SADECE 1 VİDEO AL (Farklı kanallar gelsin)
        var seenCh = new Set();
        var diverse = [];
        all.forEach(item => {
          var ch = item.uploaderName || '';
          if(!seenCh.has(ch)){
            seenCh.add(ch);
            diverse.push(item);
          }
        });

        if(diverse.length > 0){
          if(sL.length === 0){
            preloadedShorts = diverse;
          } else {
            var curNames = new Set(sL.map(x=>x.uploaderName));
            diverse.forEach(d => {
              if(!curNames.has(d.uploaderName)){
                curNames.add(d.uploaderName);
                sL.push(d);
              }
            });
          }
        }
      } catch(e) {}
      isPreloadingShorts = false;
    }

    async function initS(){
      // 4. MADDE: ÖNCEDEN YÜKLENMİŞ LİSTE VARSA ANINDA AÇILIR (SIFIR BEKLEME)
      if(preloadedShorts.length > 0 && sL.length === 0){
        sL = preloadedShorts;
        sI = 0;
        dispS();
        preloadShorts();
        return;
      }

      if(sL.length > 0){
        dispS();
        return;
      }

      gid("sPoster").style.display = "none";
      gid("sTt").textContent = "Shorts yükleniyor...";
      await preloadShorts();
      if(preloadedShorts.length > 0){
        sL = preloadedShorts;
        sI = 0;
        dispS();
      } else {
        gid("sTt").textContent = "Shorts bulunamadı. Lütfen tekrar dokunun.";
      }
    }

    function dispS(){
      if(!sL.length) return;
      var it = sL[sI], id = vid(it.url);
      curSC = it.uploaderName || '';
      curSA = it.uploaderAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(curSC)}`;

      var poster = gid("sPoster");
      if(it.thumbnail){
        poster.src = it.thumbnail;
        poster.style.display = "block";
      }

      // Optimize embed: modestbranding, iv_load_policy=3 (daha hızlı yüklenir)
      gid("sIf").src = `https://www.youtube.com/embed/${id}?autoplay=1&enablejsapi=1&rel=0&playsinline=1&controls=0&loop=1&playlist=${id}&modestbranding=1&iv_load_policy=3`;
      
      gid("sIf").onload = function(){
        setTimeout(()=>{ poster.style.display = "none"; }, 350);
      };

      gid("sTt").textContent = it.title;
      gid("sCh").textContent = curSC;
      gid("sAv").src = curSA;
      gid("sLikeBtn").classList.remove("liked");
      updSub("sSb", curSC);
      isShortPlaying = true;

      // Akıcılık için: Bir sonraki videonun görselini önceden hafızaya al
      if(sL[sI + 1] && sL[sI + 1].thumbnail){
        var preImg = new Image();
        preImg.src = sL[sI + 1].thumbnail;
      }

      if(sI >= sL.length - 3){
        preloadShorts();
      }
    }

    // ULTRA AKICI VE HIZLI GEÇİŞ (m.youtube.com GİBİ BEKLETMEDEN)
    function slideNext(){
      if(isShortTransitioning) return;
      if(sI >= sL.length - 1){
        preloadShorts();
        return;
      }
      isShortTransitioning = true;
      var wrap = gid("sWrapper");

      // Anında sonraki videoya geç ve görseli göster
      sI++;
      dispS();

      // GPU donanım hızlandırmalı yumuşak geçiş
      wrap.style.transition = 'none';
      wrap.style.transform = 'translate3d(0, 50px, 0)';
      void wrap.offsetHeight;
      wrap.style.transition = 'transform 0.16s cubic-bezier(0.2, 0.8, 0.3, 1)';
      wrap.style.transform = 'translate3d(0, 0, 0)';
      setTimeout(function(){ isShortTransitioning = false; }, 170);
    }

    function slidePrev(){
      if(isShortTransitioning || sI <= 0) return;
      isShortTransitioning = true;
      var wrap = gid("sWrapper");

      sI--;
      dispS();

      wrap.style.transition = 'none';
      wrap.style.transform = 'translate3d(0, -50px, 0)';
      void wrap.offsetHeight;
      wrap.style.transition = 'transform 0.16s cubic-bezier(0.2, 0.8, 0.3, 1)';
      wrap.style.transform = 'translate3d(0, 0, 0)';
      setTimeout(function(){ isShortTransitioning = false; }, 170);
    }

    function toggleShortPlay(){
      var iframe = gid("sIf");
      if(!iframe || !iframe.contentWindow) return;

      if(isShortPlaying){
        iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        isShortPlaying = false;
        showPlayFeedback('fa-pause');
      } else {
        iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        isShortPlaying = true;
        showPlayFeedback('fa-play');
      }
    }

    function showPlayFeedback(icon){
      var p = gid("sPlayIcon");
      p.innerHTML = `<i class="fa-solid ${icon}"></i>`;
      p.style.opacity = '1';
      p.style.transform = 'translate(-50%, -50%) scale(1.2)';
      setTimeout(function(){
        p.style.opacity = '0';
        p.style.transform = 'translate(-50%, -50%) scale(0.8)';
      }, 400);
    }

    function toggleShortLike(){
      gid("sLikeBtn").classList.toggle("liked");
    }

    function stopS(){
      gid("sIf").src="";
      gid("sPoster").src="";
    }

    // MOBİL DOKUNMA VE KAYDIRMA (GPU DONANIM HIZLANDIRMALI)
    (function setupShortSwipe(){
      var touchStartY = 0, touchStartX = 0, currentDiffY = 0, touchStartTime = 0;
      var isDragging = false;
      var touchEl = gid("sTouch");
      var wrap = gid("sWrapper");

      touchEl.addEventListener('touchstart', function(e){
        if(isShortTransitioning || e.touches.length !== 1) return;
        touchStartY = e.touches[0].clientY;
        touchStartX = e.touches[0].clientX;
        currentDiffY = 0;
        touchStartTime = Date.now();
        isDragging = true;
        wrap.style.transition = 'none';
      }, { passive: true });

      touchEl.addEventListener('touchmove', function(e){
        if(!isDragging || e.touches.length !== 1) return;
        currentDiffY = e.touches[0].clientY - touchStartY;

        if(sI === 0 && currentDiffY > 0){
          currentDiffY = currentDiffY * 0.3;
        }

        var clamped = Math.max(-90, Math.min(90, currentDiffY));
        wrap.style.transform = `translate3d(0, ${clamped}px, 0)`;
      }, { passive: true });

      touchEl.addEventListener('touchend', function(e){
        if(!isDragging) return;
        isDragging = false;

        var touchEndX = e.changedTouches[0] ? e.changedTouches[0].clientX : touchStartX;
        var diffX = touchEndX - touchStartX;
        var timeElapsed = Date.now() - touchStartTime;

        if(Math.abs(currentDiffY) < 35){
          wrap.style.transition = 'transform 0.14s ease-out';
          wrap.style.transform = 'translate3d(0, 0, 0)';
        }

        if(currentDiffY < -35 && Math.abs(currentDiffY) > Math.abs(diffX)){
          slideNext();
        }
        else if(currentDiffY > 35 && Math.abs(currentDiffY) > Math.abs(diffX)){
          slidePrev();
        }
        else if(Math.abs(currentDiffY) < 15 && Math.abs(diffX) < 15 && timeElapsed < 300){
          toggleShortPlay();
        }
      });

      var mStartY = 0, isMouseDown = false;
      touchEl.addEventListener('mousedown', function(e){
        if(isShortTransitioning) return;
        mStartY = e.clientY;
        isMouseDown = true;
      });
      window.addEventListener('mouseup', function(e){
        if(!isMouseDown) return;
        isMouseDown = false;
        var diff = e.clientY - mStartY;
        if(diff < -35) slideNext();
        else if(diff > 35) slidePrev();
        else if(Math.abs(diff) < 10) toggleShortPlay();
      });
    })();

    // 7. ALT MENÜ
    function nav(n){
      curNav=n;
      document.querySelectorAll('.nb').forEach(b=>b.classList.remove('ac'));
      if(!document.body.classList.contains('in-mini')){
        gid("wV").style.display="none";
        gid("wIf").src="";
      }
      gid("cV").style.display="none";
      stopS();
      gid("sV").style.display="none";
      gid("subBar").style.display="none";
      nextPageToken=null;

      if(n==='home'){
        gid("bH").classList.add("ac");
        gid("catBar").style.display="flex";
        if(currentCat) selectCat(currentCat);
        else loadHome();
      }
      else {
        gid("catBar").style.display="none";
        if(n==='shorts'){
          if(document.body.classList.contains('in-mini')) closeW(false);
          gid("bS").classList.add("ac");
          gid("sV").style.display="block";
          history.pushState({v:'shorts'},'');
          initS();
        }
        else if(n==='subs'){
          gid("bA").classList.add("ac");
          renderSBar();
          loadSubF();
        }
      }
    }

    // ABONELİKLER: ABONE OLUNAN KANALLARIN EN YENİ VİDEOLARI (EN YENİDEN ESKİYE)
    async function loadSubF(){
      var f=gid("vList"), s=getSubs();
      if(!s.length){
        f.innerHTML=`<div class="ld">Henüz abone olduğunuz kanal yok.<br>Üstteki büyütece <b>@okankarali</b> yazarak abone olabilirsiniz.</div>`;
        return;
      }
      f.innerHTML=`<div class="ld">Abone olduğunuz kanalların en yeni videoları yükleniyor...</div>`;

      try{
        var targets = s.slice(0, 10);
        var promises = targets.map(ch =>
          fetch(`${P}/search?q=${encodeURIComponent(ch.name)}&filter=all`)
            .then(r => r.json())
            .then(d => {
              var streams = (d.items || []).filter(i => i.type === 'stream');
              var matched = streams.filter(i => 
                (i.uploaderName||'').toLowerCase().includes(ch.name.toLowerCase()) || 
                ch.name.toLowerCase().includes((i.uploaderName||'').toLowerCase())
              );
              return matched.length > 0 ? matched.slice(0, 6) : streams.slice(0, 4);
            })
            .catch(() => [])
        );

        var results = await Promise.all(promises);
        var allSubVideos = [];
        var seenIds = new Set();

        results.forEach(arr => {
          arr.forEach(item => {
            var id = vid(item.url);
            if(id && !seenIds.has(id)){
              seenIds.add(id);
              allSubVideos.push(item);
            }
          });
        });

        // EN YENİDEN ESKİYE DOĞRU SIRALA
        sortNewest(allSubVideos);

        renderFeed(f, allSubVideos, false);
      }catch(e){
        f.innerHTML=`<div class="ld">Abonelik videoları yüklenemedi.</div>`;
      }
    }

    // PWA YÜKLEME (BEFOREINSTALLPROMPT) DESTEĞİ
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredPrompt = e;
      var b = gid("instB");
      if(b) b.style.display = "flex";
    });

    function doInstall(){
      if(deferredPrompt){
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(){
          deferredPrompt = null;
          var b = gid("instB");
          if(b) b.style.display = "none";
        });
      }
    }

    // SERVICE WORKER
    if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}

    // Başlangıç: Ana sayfayı aç ve Shorts videolarını arka planda önceden hafızaya al!
    loadHome();
    preloadShorts();
  </script>
</body>
