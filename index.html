<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Özel Video İzleyici</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #121212; color: #fff; }
    header { background: #1f1f1f; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
    .tabs { display: flex; justify-content: space-around; background: #2a2a2a; padding: 10px 0; }
    .tab-btn { background: #3a3a3a; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-size: 0.95rem; cursor: pointer; }
    .tab-btn.active { background: #e50914; }
    .player-container { width: 100%; aspect-ratio: 16/9; background: #000; display: none; }
    .player-container iframe { width: 100%; height: 100%; border: none; }
    .video-list { padding: 12px; display: grid; gap: 12px; }
    .video-card { display: flex; gap: 10px; background: #1e1e1e; border-radius: 8px; overflow: hidden; cursor: pointer; }
    .video-card img { width: 120px; height: 90px; object-fit: cover; }
    .video-info { padding: 6px; display: flex; flex-direction: column; justify-content: center; }
    .video-title { font-size: 0.85rem; font-weight: bold; line-height: 1.2; }
  </style>
</head>
<body>

  <header>Korumalı Video Alanı</header>

  <!-- Sadece bu 3 filtre seçilebilir -->
  <div class="tabs">
    <button class="tab-btn active" onclick="loadCategory('Çiçek')">🌸 Çiçek</button>
    <button class="tab-btn" onclick="loadCategory('İlahi')">🕌 İlahi</button>
    <button class="tab-btn" onclick="loadCategory('Karadeniz')">🌲 Karadeniz</button>
  </div>

  <!-- Video Oynatıcı -->
  <div id="playerBox" class="player-container">
    <iframe id="videoPlayer" allowfullscreen allow="autoplay"></iframe>
  </div>

  <!-- Video Listesi -->
  <div id="videoList" class="video-list"></div>

  <script>
    // Buraya 1. Adımda aldığınız API anahtarını yazın
    const API_KEY = "BURAYA_GOOGLE_API_KEY_YAZIN";

    async function loadCategory(keyword) {
      // Sekme buton renklerini güncelle
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(keyword));
      });

      const listDiv = document.getElementById("videoList");
      listDiv.innerHTML = "<p style='text-align:center;'>Videolar yükleniyor...</p>";

      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=15&q=${encodeURIComponent(keyword)}&key=${API_KEY}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        listDiv.innerHTML = "";

        if (!data.items || data.items.length === 0) {
          listDiv.innerHTML = "<p style='text-align:center;'>Video bulunamadı.</p>";
          return;
        }

        data.items.forEach(item => {
          const videoId = item.id.videoId;
          const title = item.snippet.title;
          const thumb = item.snippet.thumbnails.medium.url;

          const card = document.createElement("div");
          card.className = "video-card";
          card.onclick = () => playVideo(videoId);
          card.innerHTML = `
            <img src="${thumb}" alt="thumbnail">
            <div class="video-info">
              <div class="video-title">${title}</div>
            </div>
          `;
          listDiv.appendChild(card);
        });
      } catch (err) {
        listDiv.innerHTML = "<p style='text-align:center; color:red;'>Hata oluştu. API anahtarınızı kontrol edin.</p>";
      }
    }

    function playVideo(videoId) {
      const playerBox = document.getElementById("playerBox");
      const iframe = document.getElementById("videoPlayer");
      // rel=0: Alakasız video önerilerini engeller
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
      playerBox.style.display = "block";
      playerBox.scrollIntoView({ behavior: 'smooth' });
    }

    // İlk açılışta Çiçek kategorisini getir
    loadCategory('Çiçek');
  </script>
</body>
</html>
